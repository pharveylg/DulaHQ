/* ---------------- DRAW / STANDINGS ---------------- */
function getTeamById(id) {
  for (var i = 0; i < S.teams.length; i++) { if (S.teams[i].id === id) return S.teams[i]; }
  return null;
}
function fairPlayScore(s) { return -(s.yc + (s.rc_ind * 3) + (s.rc_dir * 4) + (s.yrc * 5)); }

function generateDraw() {
  if (S.teams.length < 2) return;
  var t = S.tournament;
  var k = t.structure || 'groups_knockout';
  var shuffled = S.teams.slice();
  for (var sh = shuffled.length - 1; sh > 0; sh--) {
    var rj = Math.floor(Math.random() * (sh + 1));
    var tmp = shuffled[sh]; shuffled[sh] = shuffled[rj]; shuffled[rj] = tmp;
  }
  S.groupMatches = []; S.knockoutRounds = []; S.groups = []; S.generated = true;

  if (k === 'groups_knockout') {
    var ng = t.numGroups || 2;
    for (var gi = 0; gi < ng; gi++) {
      var ids = [];
      for (var j = 0; j < shuffled.length; j++) { if (j % ng === gi) ids.push(shuffled[j].id); }
      S.groups.push({ name: String.fromCharCode(65 + gi), teamIds: ids });
    }
    for (var g2 = 0; g2 < S.groups.length; g2++) {
      var tids = S.groups[g2].teamIds;
      for (var a = 0; a < tids.length; a++) {
        for (var b = a + 1; b < tids.length; b++) {
          S.groupMatches.push({ id: uid(), group: g2, homeId: tids[a], awayId: tids[b], homeScore: null, awayScore: null, played: false, events: [], status: 'normal', refereeId: null });
        }
      }
    }
    navTo('groups');
  } else if (k === 'knockout') {
    S.groups = [{ name: 'KO', teamIds: shuffled.map(function (x) { return x.id; }) }];
    var advancers = [];
    for (var ai = 0; ai < shuffled.length; ai++) { advancers.push({ id: shuffled[ai].id, seed: 'S' + (ai + 1) }); }
    var current = [];
    for (var ci = 0; ci < advancers.length; ci += 2) {
      if (advancers[ci + 1]) current.push({ id: uid(), p1: advancers[ci], p2: advancers[ci + 1], s1: null, s2: null, played: false, winner: null, ps1: null, ps2: null, events: [] });
    }
    function rname(n) { return n === 1 ? 'Final' : (n === 2 ? 'Semi-finals' : (n === 4 ? 'Quarter-finals' : ('Round of ' + (n * 2)))); }
    S.knockoutRounds = [{ name: rname(current.length), matches: current }];
    var prev = current;
    while (prev.length > 1) {
      var next = [];
      for (var ni = 0; ni < prev.length; ni += 2) { next.push({ id: uid(), p1: null, p2: null, s1: null, s2: null, played: false, winner: null, from: [ni, ni + 1], events: [] }); }
      S.knockoutRounds.push({ name: rname(next.length), matches: next });
      prev = next;
    }
    S.bracketView = 'chart'; navTo('bracket');
  } else if (k === 'round_robin' || k === 'double_round_robin') {
    S.groups = [{ name: 'RR', teamIds: shuffled.map(function (x) { return x.id; }) }];
    var tids2 = S.groups[0].teamIds;
    var rounds = k === 'double_round_robin' ? 2 : 1;
    for (var r = 0; r < rounds; r++) {
      for (var ra = 0; ra < tids2.length; ra++) {
        for (var rb = ra + 1; rb < tids2.length; rb++) {
          var hi = r === 0 ? tids2[ra] : tids2[rb];
          var awi = r === 0 ? tids2[rb] : tids2[ra];
          S.groupMatches.push({ id: uid(), group: 0, homeId: hi, awayId: awi, homeScore: null, awayScore: null, played: false, events: [], status: 'normal', refereeId: null, round: r + 1 });
        }
      }
    }
    navTo('groups');
  } else {
    S.groups = [{ name: t.customLabel || 'Custom', teamIds: shuffled.map(function (x) { return x.id; }) }];
    navTo('groups');
  }
  var labels = { groups_knockout: 'Groups + Knockout', knockout: 'Knockout', round_robin: 'Round Robin', double_round_robin: 'Double Round Robin', custom: 'Custom' };
  var lt = labels[k] || k;
  showToast('Draw generated \u2014 ' + lt + ' format');
}
/* Manual draw. For groups_knockout and knockout, team order actually
   changes the outcome (which group / which bracket seed), so those get a
   real drag-and-drop assignment screen: teams start in one pool and get
   dragged into group boxes or match slots, disappearing from the pool as
   they're placed \u2014 so a team can never end up assigned twice by mistake.
   For round_robin/double_round_robin/custom every team plays every other
   team regardless of order, so "manual" just means "use my team list
   order, don't shuffle" \u2014 no assignment screen needed.
   Native HTML5 drag-and-drop doesn't work reliably on touch devices, so
   every drop target also supports tap-to-place: tap a team chip to select
   it, then tap the group/slot to put it there. Both paths call the exact
   same assignment functions underneath. */
function openManualDraw() {
  if (S.teams.length < 2) return;
  var t = S.tournament;
  var k = t.structure || 'groups_knockout';
  S.manualSelectedTeam = null;
  if (k === 'groups_knockout') {
    var ng = t.numGroups || 2;
    S.manualGroups = [];
    for (var g = 0; g < ng; g++) S.manualGroups.push([]);
    S.manualPool = S.teams.map(function (x) { return x.id; });
    navTo('manualdraw');
  } else if (k === 'knockout') {
    S.manualSlots = [];
    var numMatches = Math.floor(S.teams.length / 2);
    for (var m = 0; m < numMatches; m++) S.manualSlots.push({ team1: null, team2: null });
    S.manualPool = S.teams.map(function (x) { return x.id; });
    navTo('manualdraw');
  } else {
    confirmManualDraw();
  }
}
function manualDragStart(ev, teamId) { ev.dataTransfer.setData('text/plain', teamId); }
function manualAllowDrop(ev) { ev.preventDefault(); }
function manualSelectTeam(teamId) {
  S.manualSelectedTeam = (S.manualSelectedTeam === teamId) ? null : teamId;
  renderManualDraw();
}
function manualRemoveFromPools(teamId) {
  var pi = S.manualPool.indexOf(teamId);
  if (pi >= 0) S.manualPool.splice(pi, 1);
  if (S.manualGroups) {
    for (var g = 0; g < S.manualGroups.length; g++) {
      var gi = S.manualGroups[g].indexOf(teamId);
      if (gi >= 0) S.manualGroups[g].splice(gi, 1);
    }
  }
  if (S.manualSlots) {
    for (var m = 0; m < S.manualSlots.length; m++) {
      if (S.manualSlots[m].team1 === teamId) S.manualSlots[m].team1 = null;
      if (S.manualSlots[m].team2 === teamId) S.manualSlots[m].team2 = null;
    }
  }
}
function manualAssignToGroup(teamId, groupIdx) {
  if (!teamId) return;
  manualRemoveFromPools(teamId);
  S.manualGroups[groupIdx].push(teamId);
  S.manualSelectedTeam = null;
  renderManualDraw();
}
function manualDropOnGroup(ev, groupIdx) { ev.preventDefault(); manualAssignToGroup(ev.dataTransfer.getData('text/plain'), groupIdx); }
function manualGroupBoxClick(groupIdx) { if (S.manualSelectedTeam) manualAssignToGroup(S.manualSelectedTeam, groupIdx); }
function manualRemoveFromGroup(teamId, groupIdx) {
  var idx = S.manualGroups[groupIdx].indexOf(teamId);
  if (idx >= 0) S.manualGroups[groupIdx].splice(idx, 1);
  S.manualPool.push(teamId);
  renderManualDraw();
}
function manualAssignToSlot(teamId, matchIdx, slotKey) {
  if (!teamId) return;
  manualRemoveFromPools(teamId);
  S.manualSlots[matchIdx][slotKey] = teamId;
  S.manualSelectedTeam = null;
  renderManualDraw();
}
function manualDropOnSlot(ev, matchIdx, slotKey) { ev.preventDefault(); manualAssignToSlot(ev.dataTransfer.getData('text/plain'), matchIdx, slotKey); }
function manualSlotClick(matchIdx, slotKey) { if (S.manualSelectedTeam) manualAssignToSlot(S.manualSelectedTeam, matchIdx, slotKey); }
function manualRemoveFromSlot(matchIdx, slotKey) {
  var teamId = S.manualSlots[matchIdx][slotKey];
  if (teamId) { S.manualPool.push(teamId); S.manualSlots[matchIdx][slotKey] = null; renderManualDraw(); }
}
function manualTeamChip(teamId) {
  var team = getTeamById(teamId);
  var selected = S.manualSelectedTeam === teamId;
  return '<div draggable="true" ondragstart="manualDragStart(event,\'' + teamId + '\')" onclick="manualSelectTeam(\'' + teamId + '\')" class="manual-chip' + (selected ? ' selected' : '') + '"><i class="ti ti-grip-vertical"></i> ' + esc(team ? team.name : '?') + '</div>';
}
function manualSlotBox(matchIdx, slotKey, teamId) {
  var team = teamId ? getTeamById(teamId) : null;
  return '<div class="manual-dropzone manual-slot" ondragover="manualAllowDrop(event)" ondrop="manualDropOnSlot(event,' + matchIdx + ',\'' + slotKey + '\')" onclick="manualSlotClick(' + matchIdx + ',\'' + slotKey + '\')">'
    + (team ? ('<span>' + esc(team.name) + '</span><button onclick="event.stopPropagation();manualRemoveFromSlot(' + matchIdx + ',\'' + slotKey + '\')"><i class="ti ti-x"></i></button>') : '<span class="manual-placeholder">Drop team here</span>')
    + '</div>';
}
function renderManualDraw() {
  var t = S.tournament;
  var k = t.structure || 'groups_knockout';
  setTopbar('Manual draw', 'Drag a team into place, or tap a team then tap where it goes');
  if (!S.teams.length) { el('main-content').innerHTML = '<div class="empty"><p>No teams yet.</p></div>'; return; }
  var html = '<div class="alert alert-info"><i class="ti ti-info-circle"></i><span>Drag a team into place, or tap a team then tap the group/slot. Teams disappear from the pool once placed, so there\'s no way to double-assign one.</span></div>';
  html += '<div class="card"><div class="card-title">Unassigned teams (' + S.manualPool.length + ')</div><div style="display:flex;flex-wrap:wrap;gap:8px">';
  for (var i = 0; i < S.manualPool.length; i++) { html += manualTeamChip(S.manualPool[i]); }
  if (!S.manualPool.length) html += '<div style="font-size:var(--fs13);color:var(--tm)">All teams placed.</div>';
  html += '</div></div>';

  var oddLeftover = (k === 'knockout' && S.teams.length % 2 === 1) ? 1 : 0;
  var readyToConfirm = S.manualPool.length <= oddLeftover;

  if (k === 'groups_knockout') {
    html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px">';
    for (var g = 0; g < S.manualGroups.length; g++) {
      html += '<div class="card manual-dropzone" ondragover="manualAllowDrop(event)" ondrop="manualDropOnGroup(event,' + g + ')" onclick="manualGroupBoxClick(' + g + ')">';
      html += '<div class="card-title">Group ' + String.fromCharCode(65 + g) + ' (' + S.manualGroups[g].length + ')</div>';
      for (var j = 0; j < S.manualGroups[g].length; j++) {
        var tid = S.manualGroups[g][j];
        var team = getTeamById(tid);
        html += '<div class="manual-slot-filled"><span>' + esc(team ? team.name : '?') + '</span><button onclick="event.stopPropagation();manualRemoveFromGroup(\'' + tid + '\',' + g + ')"><i class="ti ti-x"></i></button></div>';
      }
      if (!S.manualGroups[g].length) html += '<div class="manual-placeholder">Drop teams here</div>';
      html += '</div>';
    }
    html += '</div>';
  } else if (k === 'knockout') {
    if (oddLeftover) html += '<div class="alert alert-info"><i class="ti ti-info-circle"></i><span>Odd number of teams \u2014 one will be left in the pool and won\'t play in the first round, same as a random draw.</span></div>';
    html += '<div class="card"><div class="card-title">Match pairings</div>';
    for (var m = 0; m < S.manualSlots.length; m++) {
      var slot = S.manualSlots[m];
      html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">' + manualSlotBox(m, 'team1', slot.team1) + '<span style="font-size:var(--fs12);color:var(--tm)">vs</span>' + manualSlotBox(m, 'team2', slot.team2) + '</div>';
    }
    html += '</div>';
  }

  html += '<div style="display:flex;gap:8px;align-items:center">'
    + '<button class="btn primary" ' + (readyToConfirm ? '' : 'disabled') + ' onclick="confirmManualDraw()"><i class="ti ti-check"></i> Confirm manual draw</button>'
    + '<button class="btn" onclick="navTo(\'setup\')">Cancel</button>'
    + (readyToConfirm ? '' : '<span style="font-size:var(--fs12);color:var(--tm)">Assign all teams before confirming</span>')
    + '</div>';
  el('main-content').innerHTML = html;
}
function confirmManualDraw() {
  var t = S.tournament;
  var k = t.structure || 'groups_knockout';
  var order = S.teams.slice();
  S.groupMatches = []; S.knockoutRounds = []; S.groups = []; S.generated = true;

  if (k === 'groups_knockout') {
    for (var gi = 0; gi < S.manualGroups.length; gi++) {
      S.groups.push({ name: String.fromCharCode(65 + gi), teamIds: S.manualGroups[gi].slice() });
    }
    for (var g2 = 0; g2 < S.groups.length; g2++) {
      var tids = S.groups[g2].teamIds;
      for (var a = 0; a < tids.length; a++) {
        for (var b = a + 1; b < tids.length; b++) {
          S.groupMatches.push({ id: uid(), group: g2, homeId: tids[a], awayId: tids[b], homeScore: null, awayScore: null, played: false, events: [], status: 'normal', refereeId: null });
        }
      }
    }
    navTo('groups');
  } else if (k === 'knockout') {
    S.groups = [{ name: 'KO', teamIds: order.map(function (x) { return x.id; }) }];
    var current = [];
    for (var m = 0; m < S.manualSlots.length; m++) {
      var slot = S.manualSlots[m];
      if (slot.team1 && slot.team2) {
        current.push({ id: uid(), p1: { id: slot.team1, seed: 'S' + (m * 2 + 1) }, p2: { id: slot.team2, seed: 'S' + (m * 2 + 2) }, s1: null, s2: null, played: false, winner: null, ps1: null, ps2: null, events: [] });
      }
    }
    function rname(n) { return n === 1 ? 'Final' : (n === 2 ? 'Semi-finals' : (n === 4 ? 'Quarter-finals' : ('Round of ' + (n * 2)))); }
    S.knockoutRounds = [{ name: rname(current.length), matches: current }];
    var prev = current;
    while (prev.length > 1) {
      var next = [];
      for (var ni = 0; ni < prev.length; ni += 2) { next.push({ id: uid(), p1: null, p2: null, s1: null, s2: null, played: false, winner: null, from: [ni, ni + 1], events: [] }); }
      S.knockoutRounds.push({ name: rname(next.length), matches: next });
      prev = next;
    }
    S.bracketView = 'chart'; navTo('bracket');
  } else if (k === 'round_robin' || k === 'double_round_robin') {
    S.groups = [{ name: 'RR', teamIds: order.map(function (x) { return x.id; }) }];
    var tids2 = S.groups[0].teamIds;
    var rounds = k === 'double_round_robin' ? 2 : 1;
    for (var r = 0; r < rounds; r++) {
      for (var ra = 0; ra < tids2.length; ra++) {
        for (var rb = ra + 1; rb < tids2.length; rb++) {
          var hi = r === 0 ? tids2[ra] : tids2[rb];
          var awi = r === 0 ? tids2[rb] : tids2[ra];
          S.groupMatches.push({ id: uid(), group: 0, homeId: hi, awayId: awi, homeScore: null, awayScore: null, played: false, events: [], status: 'normal', refereeId: null, round: r + 1 });
        }
      }
    }
    navTo('groups');
  } else {
    S.groups = [{ name: t.customLabel || 'Custom', teamIds: order.map(function (x) { return x.id; }) }];
    navTo('groups');
  }
  var labels2 = { groups_knockout: 'Groups + Knockout', knockout: 'Knockout', round_robin: 'Round Robin', double_round_robin: 'Double Round Robin', custom: 'Custom' };
  showToast('Manual draw confirmed \u2014 ' + (labels2[k] || k) + ' format');
}

function calcGroupStandings(gi) {
  var grp = S.groups[gi];
  var stats = {};
  for (var i = 0; i < grp.teamIds.length; i++) {
    var id = grp.teamIds[i];
    stats[id] = { id: id, mp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0, yc: 0, rc_ind: 0, rc_dir: 0, yrc: 0 };
  }
  var played = [];
  for (var m = 0; m < S.groupMatches.length; m++) {
    if (S.groupMatches[m].group === gi && S.groupMatches[m].played) played.push(S.groupMatches[m]);
  }
  for (var pi = 0; pi < played.length; pi++) {
    var mm = played[pi];
    var hh = stats[mm.homeId], aa = stats[mm.awayId];
    if (!hh || !aa) continue;
    if (mm.status === 'default') { hh.w++; hh.pts += 3; hh.gf += 3; hh.mp++; aa.l++; aa.ga += 3; aa.mp++; continue; }
    if (mm.status === 'dq') { hh.w++; hh.pts += 3; hh.mp++; aa.l++; aa.mp++; continue; }
    hh.mp++; aa.mp++; hh.gf += mm.homeScore; hh.ga += mm.awayScore; aa.gf += mm.awayScore; aa.ga += mm.homeScore;
    if (mm.homeScore > mm.awayScore) { hh.w++; hh.pts += 3; aa.l++; }
    else if (mm.homeScore === mm.awayScore) { hh.d++; hh.pts++; aa.d++; aa.pts++; }
    else { aa.w++; aa.pts += 3; hh.l++; }
    for (var e = 0; e < mm.events.length; e++) {
      var ev = mm.events[e];
      var tgt = ev.teamId === mm.homeId ? hh : aa;
      if (ev.type === 'yellow') tgt.yc++;
      else if (ev.type === 'red_indirect') tgt.rc_ind++;
      else if (ev.type === 'red_direct') tgt.rc_dir++;
      else if (ev.type === 'red_yellow') tgt.yrc++;
    }
  }
  var list = [];
  for (var key in stats) { list.push(stats[key]); }

  function h2hFilter(tiedIds) {
    var out = [];
    for (var mi2 = 0; mi2 < S.groupMatches.length; mi2++) {
      var mm2 = S.groupMatches[mi2];
      if (mm2.group !== gi || !mm2.played) continue;
      if (tiedIds.indexOf(mm2.homeId) >= 0 && tiedIds.indexOf(mm2.awayId) >= 0) out.push(mm2);
    }
    return out;
  }

  list.sort(function (a, b) {
    if (b.pts !== a.pts) return b.pts - a.pts;
    var tied = [];
    for (var ti2 = 0; ti2 < list.length; ti2++) { if (list[ti2].pts === a.pts) tied.push(list[ti2]); }
    if (tied.length > 1) {
      var tiedIds = tied.map(function (x) { return x.id; });
      var h2hMatches = h2hFilter(tiedIds);
      function h2pts(x) {
        var p = 0;
        for (var mj = 0; mj < h2hMatches.length; mj++) {
          var mm3 = h2hMatches[mj];
          if (mm3.homeId === x.id) { if (mm3.homeScore > mm3.awayScore) p += 3; else if (mm3.homeScore === mm3.awayScore) p += 1; }
          if (mm3.awayId === x.id) { if (mm3.awayScore > mm3.homeScore) p += 3; else if (mm3.homeScore === mm3.awayScore) p += 1; }
        }
        return p;
      }
      var pa = h2pts(a), pb = h2pts(b);
      if (pb !== pa) return pb - pa;
      function h2gd(x) {
        var gf = 0, ga = 0;
        for (var mk = 0; mk < h2hMatches.length; mk++) {
          var mm4 = h2hMatches[mk];
          if (mm4.homeId === x.id) { gf += mm4.homeScore; ga += mm4.awayScore; }
          if (mm4.awayId === x.id) { gf += mm4.awayScore; ga += mm4.homeScore; }
        }
        return gf - ga;
      }
      var ga2 = h2gd(a), gb2 = h2gd(b);
      if (gb2 !== ga2) return gb2 - ga2;
    }
    if ((b.gf - b.ga) !== (a.gf - a.ga)) return (b.gf - b.ga) - (a.gf - a.ga);
    if (b.gf !== a.gf) return b.gf - a.gf;
    return fairPlayScore(b) - fairPlayScore(a);
  });
  return list;
}

/* Shared "who/where/when" line for a match \u2014 used on Schedule, Next
   Match blocks, and expanded Match History detail. */
function matchLogisticsLine(m) {
  var ref = m.refereeId ? getRefereeById(m.refereeId) : null;
  return '<div style="font-size:var(--fs13);color:var(--tm);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap">'
    + '<span><i class="ti ti-map-pin" style="font-size:var(--fs13)"></i> ' + (m.pitchName ? esc(m.pitchName) : 'Pitch TBD') + '</span>'
    + '<span><i class="ti ti-calendar" style="font-size:var(--fs13)"></i> ' + (m.kickoff ? esc(m.kickoff) : 'Time TBD') + '</span>'
    + '<span><i class="ti ti-whistle" style="font-size:var(--fs13)"></i> ' + (ref ? esc(ref.name) : 'Unassigned') + '</span>'
    + '</div>';
}
function renderMatchEvents(m) {
  if (!m.events || !m.events.length) return '<div style="font-size:var(--fs14);color:var(--tm)">No events.</div>';
  var icons = { goal: 'ti-ball-football ev-goal', yellow: 'ti-card ev-yel', red_indirect: 'ti-card ev-red', red_direct: 'ti-card ev-red', red_yellow: 'ti-cards ev-red', sub: 'ti-arrows-exchange ev-sub', penalty_goal: 'ti-circle-dot ev-pen', penalty_miss: 'ti-circle-dot ev-red' };
  var labels = { goal: 'Goal', yellow: 'Yellow', red_indirect: 'Red (ind)', red_direct: 'Red', red_yellow: 'Y+R', sub: 'Sub', penalty_goal: 'Pen \u2713', penalty_miss: 'Pen \u2717' };
  var evs = m.events.slice().sort(function (a, b) { return a.minute - b.minute; });
  var canEdit = (S.role === 'admin' || S.role === 'referee' || S.role === 'official');
  var html = '';
  for (var i = 0; i < evs.length; i++) {
    var ev = evs[i];
    var tm2 = getTeamById(ev.teamId);
    var icParts = (icons[ev.type] || 'ti-circle').split(' ');
    var sub2 = (ev.type === 'sub' && ev.playerOff) ? (' \u2192 ' + esc(ev.playerOff)) : '';
    html += '<div class="ev-row"><span class="ev-min">' + ev.minute + '\'</span><span class="ev-i ' + (icParts[1] || '') + '"><i class="ti ' + icParts[0] + '"></i></span><span style="flex:1">' + esc(ev.player || '?') + sub2 + ' <span style="color:var(--tm)">\u2014 ' + (tm2 ? esc(tm2.name) : '?') + ' (' + esc(labels[ev.type] || ev.type) + ')</span></span>' + (canEdit ? ('<button class="btn sm" onclick="openEditEvent(\'' + ev.id + '\',\'' + m.id + '\')"><i class="ti ti-edit"></i></button>') : '') + '</div>';
  }
  return html;
}
function toggleExpand(btn) {
  var p = btn.nextElementSibling;
  var open = p.classList.toggle('open');
  btn.innerHTML = '<i class="ti ti-chevron-' + (open ? 'up' : 'down') + '"></i> ' + (open ? 'Hide' : 'Show') + ' match stats';
}

function renderGroups() {
  var k = S.tournament.structure || 'groups_knockout';
  var titles = { groups_knockout: 'Groups', knockout: 'Knockout', round_robin: 'Round Robin', double_round_robin: 'Double Round Robin', custom: 'Custom matches' };
  var pageTitle = titles[k] || 'Groups';
  setTopbar(pageTitle, '');
  if (!S.generated) { el('main-content').innerHTML = '<div class="empty"><i class="ti ti-grid-3x3"></i><p>Generate the draw from Setup first.</p></div>'; return; }
  if (k === 'knockout') { el('main-content').innerHTML = '<div class="empty"><i class="ti ti-tournament"></i><p>Knockout format \u2014 <a href="#" onclick="navTo(\'bracket\')" style="color:var(--gold)">go to Bracket</a> to enter results.</p></div>'; return; }
  if (k === 'custom') { renderCustomGroups(); return; }
  var isRR = (k === 'round_robin' || k === 'double_round_robin');
  var html = '';
  for (var gi = 0; gi < S.groups.length; gi++) {
    var grp = S.groups[gi];
    var standings = calcGroupStandings(gi);
    var advPer = isRR ? 0 : Math.min(S.tournament.advancePer || 2, standings.length);
    html += '<div class="card"><div class="card-title"><i class="ti ti-grid-3x3"></i> ' + (isRR ? 'Standings' : ('Group ' + grp.name)) + '</div>';
    html += '<table class="tbl"><thead><tr><th>#</th><th>Team</th><th class="num">MP</th><th class="num">W</th><th class="num">D</th><th class="num">L</th><th class="num">GF</th><th class="num">GA</th><th class="num">GD</th><th class="num">Pts</th></tr></thead><tbody>';
    for (var si = 0; si < standings.length; si++) {
      var s = standings[si];
      var tm3 = getTeamById(s.id);
      var gd = s.gf - s.ga;
      var adv = !isRR && si < advPer;
      var winner = isRR && si === 0;
      html += '<tr><td><span style="font-weight:600;color:' + (adv ? 'var(--green)' : (winner ? 'var(--gold)' : 'var(--tm)')) + '">' + (si + 1) + '</span></td>';
      html += '<td><span style="font-weight:500">' + (tm3 ? esc(tm3.name) : '?') + '</span>' + (adv ? '<span class="badge bgr" style="margin-left:6px;font-size:var(--fs12)">ADV</span>' : '') + '</td>';
      html += '<td class="num">' + s.mp + '</td><td class="num">' + s.w + '</td><td class="num">' + s.d + '</td><td class="num">' + s.l + '</td>';
      html += '<td class="num">' + s.gf + '</td><td class="num">' + s.ga + '</td>';
      html += '<td class="num" style="color:' + (gd > 0 ? 'var(--green)' : (gd < 0 ? 'var(--red)' : 'var(--ts)')) + '">' + (gd > 0 ? '+' : '') + gd + '</td>';
      html += '<td class="num" style="font-weight:600">' + s.pts + '</td></tr>';
    }
    html += '</tbody></table>';
    var grpMatches = [];
    for (var mi2 = 0; mi2 < S.groupMatches.length; mi2++) { if (S.groupMatches[mi2].group === gi) grpMatches.push(S.groupMatches[mi2]); }
    if (grpMatches.length) {
      html += '<div style="margin-top:10px"><div style="font-size:var(--fs13);color:var(--tm);margin-bottom:8px">Fixtures' + (k === 'double_round_robin' ? ' (R1 + R2)' : '') + '</div>';
      for (var fi2 = 0; fi2 < grpMatches.length; fi2++) {
        var mm5 = grpMatches[fi2];
        var ht = getTeamById(mm5.homeId);
        var at = getTeamById(mm5.awayId);
        html += '<div class="mc"><div class="mc-hd"><div style="display:flex;align-items:center;gap:6px"><span class="badge ' + (mm5.played ? 'bgr' : 'bgy') + '">' + (mm5.played ? 'Full time' : 'Scheduled') + '</span>' + (mm5.round ? ('<span style="font-size:var(--fs12);color:var(--tm)">Round ' + mm5.round + '</span>') : '') + '</div>'
          + (S.role === 'admin' ? ('<button class="btn sm" onclick="openMatchEdit(\'' + mm5.id + '\')"><i class="ti ti-edit"></i> ' + (mm5.played ? 'Edit' : 'Score') + '</button>') : '') + '</div>'
          + '<div class="mc-teams"><div class="mc-team">' + (ht ? esc(ht.name) : '?') + '</div><div class="mc-score">' + (mm5.played ? (mm5.homeScore + '\u2013' + mm5.awayScore) : '\u2013') + '</div><div class="mc-team r">' + (at ? esc(at.name) : '?') + '</div></div>'
          + ((mm5.played && mm5.events && mm5.events.length) ? ('<button class="expand-btn" onclick="toggleExpand(this)"><i class="ti ti-chevron-down"></i> Match stats</button><div class="mc-expand">' + renderMatchEvents(mm5) + '</div>') : '')
          + '</div>';
      }
      html += '</div>';
    }
    html += '</div>';
  }
  el('main-content').innerHTML = html;
}

function renderCustomGroups() {

/* ---------------- BRACKET ---------------- */
function buildKnockout() {
  var total = S.groupMatches.length, played = 0;
  for (var i = 0; i < S.groupMatches.length; i++) { if (S.groupMatches[i].played) played++; }
  if (played < total) return null;
  var advancers = getAdvancers();
  if (!advancers.length) return null;
  var rounds = [];
  var current = [];
  for (var ci = 0; ci < advancers.length; ci += 2) {
    if (advancers[ci + 1]) current.push({ id: uid(), p1: advancers[ci], p2: advancers[ci + 1], s1: null, s2: null, played: false, winner: null, ps1: null, ps2: null, events: [] });
  }
  function rn(n) { return n === 1 ? 'Final' : (n === 2 ? 'Semi-finals' : (n === 4 ? 'Quarter-finals' : ('Round of ' + (n * 2)))); }
  rounds.push({ name: rn(current.length), matches: current });
  var prev = current;
  while (prev.length > 1) {
    var next = [];
    for (var ni = 0; ni < prev.length; ni += 2) { next.push({ id: uid(), p1: null, p2: null, s1: null, s2: null, played: false, winner: null, from: [ni, ni + 1], events: [] }); }
    rounds.push({ name: rn(next.length), matches: next });
    prev = next;
  }
  return rounds;
}
function propagateKnockout() {
  for (var ri = 1; ri < S.knockoutRounds.length; ri++) {
    var prev = S.knockoutRounds[ri - 1];
    var cur = S.knockoutRounds[ri];
    for (var mi = 0; mi < cur.matches.length; mi++) {
      var m = cur.matches[mi];
      if (!m.from) continue;
      var w0 = prev.matches[m.from[0]] ? prev.matches[m.from[0]].winner : null;
      var w1 = prev.matches[m.from[1]] ? prev.matches[m.from[1]].winner : null;
      if (w0) m.p1 = { id: w0.id, seed: 'W' + (m.from[0] + 1) };
      if (w1) m.p2 = { id: w1.id, seed: 'W' + (m.from[1] + 1) };
    }
  }
}

function renderBracketChart(rounds) {
  if (!rounds || !rounds.length) return '<p style="padding:20px;color:var(--tm)">No bracket data.</p>';
  var gold = '#c8960a', goldFill = 'rgba(200,150,10,0.14)', textC = '#1a1a1a', muted = '#9aa0a8', nb = '#e6dcc2', navy3 = '#f7f3ea', navy4 = '#ffffff';
  var SW = 130, SH = 28, SGAP = 6, MH = SH * 2 + SGAP, CP = SW + 50, PX = 14, PY = 30, LH = 16;
  var numSide = rounds.length - 1;
  var maxM = rounds[0].matches.length;
  var sP = Math.max(38, 280 / maxM);
  var totS = maxM * 2;
  var totH = PY + LH + totS * sP + PY + 48;
  var totW = PX * 2 + (numSide * 2 + 1) * CP;
  function cX(ci) { return PX + ci * CP; }
  var fX = PX + numSide * CP;
  function rX(ci) { return fX + (ci + 1) * CP; }
  function mY(ri, mi) {
    var f = Math.pow(2, ri);
    var ts = mi * f * 2;
    var bs = ts + f * 2 - 1;
    var cs = (ts + bs) / 2;
    return PY + LH + cs * sP - MH / 2;
  }
  var fY = PY + LH + (totS / 2 - 1) * sP - MH / 2 + sP / 2;
  var s = '<svg xmlns="http://www.w3.org/2000/svg" width="' + totW + '" height="' + totH + '" viewBox="0 0 ' + totW + ' ' + totH + '" style="width:100%;height:auto;display:block;font-family:Inter,system-ui,sans-serif">';
  s += '<rect width="' + totW + '" height="' + totH + '" fill="' + navy4 + '" rx="10"/>';
  function ln(x1, y1, x2, y2) { s += '<line x1="' + Math.round(x1) + '" y1="' + Math.round(y1) + '" x2="' + Math.round(x2) + '" y2="' + Math.round(y2) + '" stroke="' + nb + '" stroke-width="1"/>'; }
  function drawSlot(x, y, team, tid, winner, score, seed, flip) {
    var isW = !!(winner && tid && tid === winner);
    var isL = !!(winner && tid && tid !== winner);
    var fill = isW ? goldFill : navy3, bdr = isW ? gold : nb, nc = isL ? muted : ((team || seed) ? textC : muted);
    var nm = team ? (team.name.length > 15 ? (team.name.slice(0, 14) + '\u2026') : team.name) : (seed || 'TBD');
    var sc = (score !== null && score !== undefined) ? String(score) : '';
    s += '<rect x="' + x + '" y="' + y + '" width="' + SW + '" height="' + SH + '" rx="4" fill="' + fill + '" stroke="' + bdr + '" stroke-width="1"/>';
    if (isW) s += '<rect x="' + (flip ? (x + SW - 3) : x) + '" y="' + y + '" width="3" height="' + SH + '" rx="1" fill="' + gold + '"/>';
    if (flip) {
      s += '<text x="' + (x + SW - 8) + '" y="' + (y + 18) + '" font-size="11" font-weight="' + (isW ? '600' : '400') + '" fill="' + nc + '" text-anchor="end">' + nm + '</text>';
      if (sc) s += '<text x="' + (x + 8) + '" y="' + (y + 18) + '" font-size="12" font-weight="700" fill="' + (isW ? gold : muted) + '" text-anchor="start">' + sc + '</text>';
    } else {
      s += '<text x="' + (x + 8) + '" y="' + (y + 18) + '" font-size="11" font-weight="' + (isW ? '600' : '400') + '" fill="' + nc + '" text-anchor="start">' + nm + '</text>';
      if (sc) s += '<text x="' + (x + SW - 8) + '" y="' + (y + 18) + '" font-size="12" font-weight="700" fill="' + (isW ? gold : muted) + '" text-anchor="end">' + sc + '</text>';
    }
  }
  function drawMatch(x, y, m, flip) {
    var p1 = m.p1 ? getTeamById(m.p1.id) : null, p2 = m.p2 ? getTeamById(m.p2.id) : null, w = m.winner ? m.winner.id : null;
    drawSlot(x, y, p1, m.p1 ? m.p1.id : null, w, m.played ? m.s1 : null, m.p1 ? m.p1.seed : null, flip);
    drawSlot(x, y + SH + SGAP, p2, m.p2 ? m.p2.id : null, w, m.played ? m.s2 : null, m.p2 ? m.p2.seed : null, flip);
    if (m.ps1 !== null && m.ps1 !== undefined && m.played) {
      s += '<rect x="' + x + '" y="' + (y + MH + 2) + '" width="' + SW + '" height="13" rx="3" fill="rgba(124,58,237,0.12)" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>';
      s += '<text x="' + (x + SW / 2) + '" y="' + (y + MH + 11) + '" font-size="9" fill="#7c3aed" text-anchor="middle" font-weight="600">PENS ' + m.ps1 + '\u2013' + m.ps2 + '</text>';
    }
  }
  for (var ri = 0; ri < numSide; ri++) {
    var cx = cX(ri), ncx = ri < numSide - 1 ? cX(ri + 1) : fX, midX = cx + SW + (ncx - cx - SW) / 2;
    var matches = rounds[ri].matches;
    for (var mi = 0; mi < matches.length; mi++) {
      var y0 = mY(ri, mi), cy0 = y0 + SH / 2, cy1 = y0 + SH + SGAP + SH / 2;
      ln(cx + SW, cy0, midX, cy0); ln(cx + SW, cy1, midX, cy1); ln(midX, cy0, midX, cy1);
      var nmi = Math.floor(mi / 2), nsl = mi % 2;
      var ny = ri + 1 < numSide ? mY(ri + 1, nmi) : fY;
      var ncy = ny + nsl * (SH + SGAP) + SH / 2;
      ln(midX, (cy0 + cy1) / 2, midX, ncy); ln(midX, ncy, ncx, ncy);
    }
  }
  for (var rj = 0; rj < numSide; rj++) {
    var srcRi = numSide - 1 - rj, rcx = rX(rj), rncx = rj < numSide - 1 ? rX(rj + 1) : (fX + SW), rmidX = rcx - (rcx - rncx) / 2;
    var matches2 = rounds[srcRi].matches;
    for (var mj = 0; mj < matches2.length; mj++) {
      var y02 = mY(srcRi, mj), cy02 = y02 + SH / 2, cy12 = y02 + SH + SGAP + SH / 2;
      ln(rcx, cy02, rmidX, cy02); ln(rcx, cy12, rmidX, cy12); ln(rmidX, cy02, rmidX, cy12);
      var nmi2 = Math.floor(mj / 2), nsl2 = mj % 2;
      var prv = srcRi - 1;
      var ny2 = prv >= 0 ? mY(prv, nmi2) : fY;
      var ncy2 = ny2 + nsl2 * (SH + SGAP) + SH / 2;
      ln(rmidX, (cy02 + cy12) / 2, rmidX, ncy2); ln(rmidX, ncy2, rncx, ncy2);
    }
  }
  for (var li = 0; li < numSide; li++) {
    var lcx = cX(li);
    s += '<text x="' + (lcx + SW / 2) + '" y="' + (PY + LH - 3) + '" font-size="9" font-weight="600" fill="' + muted + '" text-anchor="middle" letter-spacing="0.07em">' + rounds[li].name.toUpperCase() + '</text>';
    var lm = rounds[li].matches;
    for (var lmi = 0; lmi < lm.length; lmi++) { drawMatch(cX(li), mY(li, lmi), lm[lmi], false); }
  }
  for (var rk = 0; rk < numSide; rk++) {
    var srcR2 = numSide - 1 - rk, rcx2 = rX(rk);
    s += '<text x="' + (rcx2 + SW / 2) + '" y="' + (PY + LH - 3) + '" font-size="9" font-weight="600" fill="' + muted + '" text-anchor="middle" letter-spacing="0.07em">' + rounds[srcR2].name.toUpperCase() + '</text>';
    var rm = rounds[srcR2].matches;
    for (var rmi = 0; rmi < rm.length; rmi++) { drawMatch(rX(rk), mY(srcR2, rmi), rm[rmi], true); }
  }
  s += '<text x="' + (fX + SW / 2) + '" y="' + (PY + LH - 3) + '" font-size="9" font-weight="600" fill="' + gold + '" text-anchor="middle" letter-spacing="0.07em">FINAL</text>';
  drawMatch(fX, fY, rounds[rounds.length - 1].matches[0], false);
  var tY = fY + MH + 14;
  s += '<text x="' + (fX + SW / 2) + '" y="' + (tY + 16) + '" font-size="20" text-anchor="middle">\u{1F3C6}</text>';
  var lastM = rounds[rounds.length - 1].matches[0];
  var champ = lastM.winner ? getTeamById(lastM.winner.id) : null;
  if (champ) {
    s += '<rect x="' + fX + '" y="' + (tY + 22) + '" width="' + SW + '" height="20" rx="4" fill="' + goldFill + '" stroke="' + gold + '" stroke-width="1"/>';
    s += '<text x="' + (fX + SW / 2) + '" y="' + (tY + 35) + '" font-size="10" font-weight="600" fill="' + gold + '" text-anchor="middle">' + champ.name + '</text>';
  }
  s += '</svg>';
  return s;
}

function renderBracket() {
  setTopbar('Knockout bracket', '');
  var mc = el('main-content');
  mc.innerHTML = '<div class="view-toggle"><button class="vt-btn' + (S.bracketView === 'chart' ? ' active' : '') + '" onclick="S.bracketView=\'chart\';renderBracket()"><i class="ti ti-tournament"></i> Chart</button><button class="vt-btn' + (S.bracketView === 'list' ? ' active' : '') + '" onclick="S.bracketView=\'list\';renderBracket()"><i class="ti ti-list"></i> List</button></div><div id="bk"></div>';
  var bk = el('bk');
  if (!S.generated) { bk.innerHTML = '<div class="empty"><i class="ti ti-tournament"></i><p>Generate the draw first.</p></div>'; return; }

  if (k === 'knockout' && !S.knockoutRounds.length) { bk.innerHTML = '<div class="empty"><i class="ti ti-tournament"></i><p>Enter the first round results to progress the bracket.</p></div>'; return; }
  var total = S.groupMatches.length, played = 0;
  for (var i = 0; i < S.groupMatches.length; i++) { if (S.groupMatches[i].played) played++; }
  if (k !== 'knockout' && played < total && !S.knockoutRounds.length) {
    var pct = Math.round(played / total * 100);
    bk.innerHTML = '<div class="card"><div class="card-title"><i class="ti ti-lock"></i> Group stage in progress</div><div style="font-size:var(--fs14);color:var(--tm);margin-bottom:8px">' + played + ' of ' + total + ' played</div><div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div></div>';
    return;
  }
  if (!S.knockoutRounds.length) { var built = buildKnockout(); if (built) S.knockoutRounds = built; }
  propagateKnockout();
  var lastRound = S.knockoutRounds[S.knockoutRounds.length - 1];
  var champion = (lastRound && lastRound.matches[0]) ? lastRound.matches[0].winner : null;
  var html = '';
  if (champion) {
    var ct = getTeamById(champion.id);
    html += '<div class="trophy-card"><i class="ti ti-trophy trophy-icon"></i><div class="trophy-winner">' + (ct ? esc(ct.name) : 'Champion') + '</div><div class="trophy-sub">Tournament Champion</div></div>';
  }

    try {
      html += '<div style="border:1px solid var(--nb);border-radius:10px;overflow-x:auto;overflow-y:visible;margin-bottom:14px"><div style="min-width:600px">' + renderBracketChart(S.knockoutRounds) + '</div></div>';
      html += '<div style="display:flex;gap:14px;flex-wrap:wrap;font-size:var(--fs13);color:var(--tm);margin-bottom:14px"><span style="display:flex;align-items:center;gap:5px"><span style="width:12px;height:12px;background:rgba(200,150,10,.18);border:1px solid #c8960a;border-left:3px solid #c8960a;border-radius:2px;display:inline-block"></span>Winner</span><span style="display:flex;align-items:center;gap:5px"><span style="width:12px;height:12px;background:var(--n3);border:1px solid var(--nb);border-radius:2px;display:inline-block"></span>Eliminated / TBD</span></div>';
    } catch (e) {
      html += '<div class="alert alert-err"><i class="ti ti-alert-triangle"></i><span>Chart error: ' + esc(e.message) + '</span></div>';
    }
    for (var ri2 = 0; ri2 < S.knockoutRounds.length; ri2++) {
      var round = S.knockoutRounds[ri2];
      for (var mi2 = 0; mi2 < round.matches.length; mi2++) {
        var m = round.matches[mi2];
        if (!m.played) continue;
        var p1 = m.p1 ? getTeamById(m.p1.id) : null, p2 = m.p2 ? getTeamById(m.p2.id) : null;
        html += '<div class="mc" style="margin-bottom:6px"><div class="mc-hd"><span class="badge bgr">' + round.name + '</span>' + ((m.ps1 !== null && m.ps1 !== undefined) ? ('<span class="badge bpur">Pens ' + m.ps1 + '\u2013' + m.ps2 + '</span>') : '') + '</div>'
          + '<div class="mc-teams"><div class="mc-team" style="' + ((m.winner && m.winner.id === m.p1.id) ? 'color:var(--gold)' : '') + '">' + (p1 ? esc(p1.name) : '?') + '</div><div class="mc-score">' + m.s1 + '\u2013' + m.s2 + '</div><div class="mc-team r" style="' + ((m.winner && m.winner.id === m.p2.id) ? 'color:var(--gold)' : '') + '">' + (p2 ? esc(p2.name) : '?') + '</div></div>'
          + ((m.events && m.events.length) ? ('<button class="expand-btn" onclick="toggleExpand(this)"><i class="ti ti-chevron-down"></i> Match stats</button><div class="mc-expand">' + renderMatchEvents(m) + '</div>') : '') + '</div>';
      }
    }
  } else {
    for (var ri3 = 0; ri3 < S.knockoutRounds.length; ri3++) {
      var round2 = S.knockoutRounds[ri3];
      html += '<div style="margin-bottom:20px"><div class="ko-round-title">' + round2.name + '</div>';
      for (var mi3 = 0; mi3 < round2.matches.length; mi3++) {
        var m2 = round2.matches[mi3];
        var p1b = m2.p1 ? getTeamById(m2.p1.id) : null, p2b = m2.p2 ? getTeamById(m2.p2.id) : null;
        html += '<div class="mc"><div class="mc-hd"><span class="badge ' + (m2.played ? 'bgr' : 'bgy') + '">' + (m2.played ? 'Full time' : 'Scheduled') + '</span>'
          + ((S.role === 'admin' && m2.p1 && m2.p2) ? ('<button class="btn sm" onclick="openKoEdit(' + ri3 + ',' + mi3 + ')"><i class="ti ti-edit"></i> ' + (m2.played ? 'Edit' : 'Score') + '</button>') : '') + '</div>'
          + '<div class="mc-teams"><div class="mc-team" style="' + ((m2.winner && m2.p1 && m2.winner.id === m2.p1.id) ? 'color:var(--gold)' : '') + '">' + (p1b ? esc(p1b.name) : '<span style="color:var(--tm);font-style:italic">TBD</span>') + '</div>'
          + '<div class="mc-score">' + (m2.played ? (m2.s1 + '\u2013' + m2.s2) : '\u2013') + '</div>'
          + '<div class="mc-team r" style="' + ((m2.winner && m2.p2 && m2.winner.id === m2.p2.id) ? 'color:var(--gold)' : '') + '">' + (p2b ? esc(p2b.name) : '<span style="color:var(--tm);font-style:italic">TBD</span>') + '</div></div>'
          + ((m2.played && m2.winner) ? ('<div style="padding:4px 14px 10px;font-size:var(--fs13)"><span class="badge bgr">' + (getTeamById(m2.winner.id) ? getTeamById(m2.winner.id).name : '?') + ' advances</span>' + ((m2.ps1 !== null && m2.ps1 !== undefined) ? ('<span class="badge bpur" style="margin-left:6px">Pens: ' + m2.ps1 + '\u2013' + m2.ps2 + '</span>') : '') + '</div>') : '')

          + '</div>';
      }
      html += '</div>';
    }
  }
  bk.innerHTML = html;
}

function saveKoScore(ri, mi) {
  var m = S.knockoutRounds[ri].matches[mi];
  var s1 = parseInt(el('ko-s1').value), s2 = parseInt(el('ko-s2').value);
  if (isNaN(s1) || isNaN(s2)) return;
  m.s1 = s1; m.s2 = s2; m.played = true;
  var ps1El = el('ko-ps1'), ps2El = el('ko-ps2');
  var ps1 = ps1El ? parseInt(ps1El.value) : NaN;
  var ps2 = ps2El ? parseInt(ps2El.value) : NaN;
  if (!isNaN(ps1) && !isNaN(ps2)) { m.ps1 = ps1; m.ps2 = ps2; }
  var wId;
  if (s1 > s2) wId = m.p1.id;
  else if (s2 > s1) wId = m.p2.id;
  else if (m.ps1 !== null && m.ps1 !== undefined) wId = m.ps1 > m.ps2 ? m.p1.id : m.p2.id;
  else { alert('Enter penalty scores for tied matches.'); return; }
  m.winner = { id: wId };
  var p1n = m.p1 ? (getTeamById(m.p1.id) || {}).name : '?';
  var p2n = m.p2 ? (getTeamById(m.p2.id) || {}).name : '?';
  logAudit('Knockout result saved', p1n + ' ' + m.s1 + '\u2013' + m.s2 + ' ' + p2n + (m.ps1 !== null && m.ps1 !== undefined ? (' (pens ' + m.ps1 + '\u2013' + m.ps2 + ')') : ''), m.id);
  closeModal(); propagateKnockout(); render(); showToast('Result saved'); autoSave();
}

/* ---------------- TEAM MANAGER DASHBOARD ---------------- */
/* Full team records (with players/coach/docs) across every category, each
   tagged with its category. Used to scope a Team Manager's view to only
   the teams assigned to their user account. */
function getFullTeamsAcrossCategories() {
  var out = [];
  for (var c = 0; c < S.categories.length; c++) {
    var cat = S.categories[c];
    for (var t = 0; t < cat.teams.length; t++) {
      out.push({ team: cat.teams[t], categoryId: cat.id, categoryName: cat.name });
    }
  }
  return out;
}
function getMyTeamRecords() {
  var u = S.activeUserId ? getUserById(S.activeUserId) : null;
  if (!u) return [];
  var all = getFullTeamsAcrossCategories();
  var out = [];
  for (var i = 0; i < all.length; i++) { if (u.assignedTeams.indexOf(all[i].team.id) >= 0) out.push(all[i]); }
  return out;
}
function setActiveTeamManager(userId) {
  S.activeUserId = userId || null;
  var mine = getMyTeamRecords();
  S.activeTeamId = mine.length ? mine[0].team.id : null;
  if (mine.length) S.activeCategoryId = mine[0].categoryId;
  renderNav();
  render();
}
function pickMyTeam(teamId, categoryId) {
  S.activeTeamId = teamId;
  if (categoryId) S.activeCategoryId = categoryId;
  render();
}
function pickMyTeamFromSelect(val) {
  if (!val) return;
  var parts = val.split('|');
  pickMyTeam(parts[0], parts[1]);
}
/* Shared by the Team Manager dashboard and the public Team Profile view.
   Assumes S.activeCategoryId already points at the team's category (both
   call sites guarantee this before calling). */
function computeTeamStats(tm) {
  var cat = activeCategory();
  var myMatches = [];
  for (var i = 0; i < cat.groupMatches.length; i++) { var mm = cat.groupMatches[i]; if (mm.homeId === tm.id || mm.awayId === tm.id) myMatches.push(mm); }
  var next = null, prev = [];
  for (var n = 0; n < myMatches.length; n++) { if (!myMatches[n].played) { if (!next) next = myMatches[n]; } else { prev.push(myMatches[n]); } }
  var groupIdx = -1;
  for (var g = 0; g < cat.groups.length; g++) { if (cat.groups[g].teamIds.indexOf(tm.id) >= 0) { groupIdx = g; break; } }
  var rankLabel = 'Not yet drawn';
  if (groupIdx >= 0) {
    var standings = calcGroupStandings(groupIdx);
    for (var s = 0; s < standings.length; s++) { if (standings[s].id === tm.id) { rankLabel = '#' + (s + 1) + ' of ' + standings.length + ' in Group ' + cat.groups[groupIdx].name + ' (' + standings[s].pts + ' pts)'; break; } }
  }
  var goals = 0, yellow = 0, red = 0;
  for (var pm = 0; pm < myMatches.length; pm++) {
    var evs = myMatches[pm].events || [];
    for (var e = 0; e < evs.length; e++) {
      if (evs[e].teamId !== tm.id) continue;
      if (evs[e].type === 'goal' || evs[e].type === 'penalty_goal') goals++;
      else if (evs[e].type === 'yellow') yellow++;
      else if (evs[e].type === 'red_direct' || evs[e].type === 'red_indirect' || evs[e].type === 'red_yellow') red++;
    }
  }
  return { next: next, prev: prev, rankLabel: rankLabel, goals: goals, yellow: yellow, red: red, groupIdx: groupIdx };
}

        + '<button class="expand-btn" onclick="toggleExpand(this)"><i class="ti ti-chevron-down"></i> Match details</button><div class="mc-expand">' + matchLogisticsLine(pmch) + ((pmch.events && pmch.events.length) ? renderMatchEvents(pmch) : '<div style="font-size:var(--fs14);color:var(--tm);margin-top:8px">No goals, cards, or substitutions logged.</div>') + '</div>'

var DOC_UPLOAD_TYPES = { birthCert: 'Birth Certificate', nationalId: 'National ID (in lieu of Birth Cert)', medical: 'Medical Clearance', other: 'Other' };
/* Team-level completion: birth cert + registration are required on the
   fixed checklist (medical stays optional there); status also reflects
   whether any per-player uploads are still awaiting review. */
function computeTeamDocStatus(tm) {
  var dcs = tm.docs || {};
  var requiredKeys = ['birthCert', 'registration'];
  var submittedRequired = 0;
  for (var i = 0; i < requiredKeys.length; i++) { if (dcs[requiredKeys[i]] === 'submitted') submittedRequired++; }
  var uploads = tm.documents || [];
  var pendingUploads = 0;
  for (var j = 0; j < uploads.length; j++) { if (uploads[j].status === 'pending') pendingUploads++; }
  var status, label;
  if (submittedRequired < requiredKeys.length) { status = 'incomplete'; label = 'Incomplete'; }
  else if (pendingUploads > 0) { status = 'pending'; label = 'Pending Review'; }
  else { status = 'completed'; label = 'Completed'; }
  return { status: status, label: label, submittedRequired: submittedRequired, requiredTotal: requiredKeys.length, pendingUploads: pendingUploads };
}
function docStatusBadgeHtml(tm) {
  var st = computeTeamDocStatus(tm);
  var cls = st.status === 'completed' ? 'bgr' : (st.status === 'pending' ? 'bamb' : 'brd');
  var icon = st.status === 'completed' ? '\u2713' : (st.status === 'pending' ? '\u23f3' : '\u26a0');
  return '<span class="badge ' + cls + '" title="' + st.submittedRequired + '/' + st.requiredTotal + ' required documents submitted' + (st.pendingUploads ? (', ' + st.pendingUploads + ' upload(s) pending review') : '') + '">' + icon + ' Docs: ' + st.label + '</span>';
}
/* Which required per-player documents (birth cert/national ID, medical) a
   player is missing entirely vs. still has pending review, based on the
   type+player-scoped uploads on the team. */
function getPlayerDocFlags(tm, player) {
  var uploads = tm.documents || [];
  var hasBirth = false, hasBirthPending = false, hasMedical = false, hasMedicalPending = false;
  for (var i = 0; i < uploads.length; i++) {
    var d = uploads[i];
    if (d.playerId !== player.id) continue;
    if (d.type === 'birthCert' || d.type === 'nationalId') {
      if (d.status === 'approved') hasBirth = true; else if (d.status !== 'rejected') hasBirthPending = true;
    }
    if (d.type === 'medical') {
      if (d.status === 'approved') hasMedical = true; else if (d.status !== 'rejected') hasMedicalPending = true;
    }
  }
  var missing = [];
  if (!hasBirth && !hasBirthPending) missing.push('Birth cert/ID');
  if (!hasMedical && !hasMedicalPending) missing.push('Medical');
  var pending = [];
  if (hasBirthPending) pending.push('Birth cert/ID');
  if (hasMedicalPending) pending.push('Medical');
  return { missing: missing, pending: pending };
}

function reviewDocument(teamId, docId, status) {

  for (var i = 0; i < tm.documents.length; i++) { if (tm.documents[i].id === docId) { doc = tm.documents[i]; break; } }

  var hs = 0, as2 = 0;
  var evts = m.events || [];
  for (var i = 0; i < evts.length; i++) {

    if (ev.type === 'goal' || ev.type === 'penalty_goal') {
      if (ev.teamId === m.homeId) hs++; else as2++;

  }
  return { hs: hs, as: as2 };
}

function assignPitch(mid, pitch) {

}
function assignKickoff(mid, time) {
  if (time) {

    if (conflicts.length) { showToast(conflicts[0]); renderOfficials(); return; }
  }
  for (var i = 0; i < S.groupMatches.length; i++) { if (S.groupMatches[i].id === mid) { S.groupMatches[i].kickoff = time; break; } }

function markInProgress(mid) {

/* Once a match is played (via End Match or a manual score override), it
   starts out unverified so teams know the result may still be double-checked.
   Admin/Tournament Committee tick this once they've confirmed it's accurate. */
function verifyMatch(mid, checked) {
  var m = null;
  for (var i = 0; i < S.groupMatches.length; i++) { if (S.groupMatches[i].id === mid) { m = S.groupMatches[i]; break; } }
  if (!m) return;

  renderOfficials();
}

/* ---------------- LIVE STREAMS (Facebook Live embeds) ----------------
   Slots are capped at the number of teams registered in the active
   category (one stream per registered team, at most). Each embed can
   optionally be tagged to a specific match; if tagged, the audience can
   only view it while that match is marked live (inProgress). Untagged
   embeds are always viewable once added. */
function defaultLiveEmbed() { return { id: 'live_' + uid(), categoryId: '', url: '', label: '', matchId: '' }; }
/* Converts a normal YouTube or Facebook watch/share URL into the correct
   embeddable iframe src for that platform. This can only get the URL
   format right \u2014 it can't make a private video embeddable. The feed
   still has to be set to Public, and (for YouTube specifically) the
   video owner has to have embedding allowed; if either isn't true, the
   platform will refuse inside the iframe regardless of URL format. */
function extractYouTubeId(url) {
  var m = String(url || '').match(/(?:youtube\.com\/(?:watch\?v=|live\/|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}
function detectStreamPlatform(url) {

function openCardModal(type) {
  pauseForEvent();

  for (var i = 0; i < S.groupMatches.length; i++) { if (S.groupMatches[i].id === S.currentMatchId) { m = S.groupMatches[i]; break; } }
  var ht = getTeamById(m.homeId), at = getTeamById(m.awayId);
  var isRed = type === 'red_direct';
  var body = '<div class="field"><label>Team</label><select id="ev-team" onchange="updatePlayerList()"><option value="' + m.homeId + '">' + (ht ? esc(ht.name) : 'Home') + '</option><option value="' + m.awayId + '">' + (at ? esc(at.name) : 'Away') + '</option></select></div>'
    + '<div class="field"><label>Player</label><select id="ev-player-sel">' + playerOpts(m.homeId) + '</select></div>'
    + (isRed ? '<div class="field"><label>Card type</label><select id="ev-redtype"><option value="red_direct">Direct red</option><option value="red_indirect">Indirect red</option><option value="red_yellow">Yellow + Red</option></select></div>' : '')
    + '<div class="field"><label>Minute</label><input type="number" id="ev-min" value="' + (elapsedMinute() || 1) + '" min="1" max="120"></div>';
  openModal(isRed ? '\ud83d\udfe5 Red Card' : '\ud83d\udfe8 Yellow Card', body, '<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="logCard(\'' + type + '\')"><i class="ti ti-check"></i> Log</button>');
}
function updatePlayerList() {
  var teamEl = el('ev-team');
  var tid = teamEl ? teamEl.value : null;
  var s2 = el('ev-player-sel');
  if (!s2 || !tid) return;
  s2.innerHTML = playerOpts(tid);
}
/* If a match has already been played and its events are edited afterward
   (post-game correction), keep the official score in sync with the event
   log and require re-verification \u2014 otherwise the displayed final score
   could silently drift from what the events list actually shows. */
function syncPlayedMatchAfterEventChange(m) {
  if (!m.played) return;
  var recomputed = getMatchScore(m);
  m.homeScore = recomputed.hs;
  m.awayScore = recomputed.as;
  m.verified = false;
}
/* Wipes every logged event (goals, cards, subs) for a match. This does NOT
   remove anything from the audit trail \u2014 past "Goal logged" / "Card
   logged" entries stay exactly where they are, and this action itself gets
   its own audit entry, so there's always a permanent record even though the
   event log on the match is now empty. */
function clearAllEvents(matchId) {
  var m = null;
  for (var i = 0; i < S.groupMatches.length; i++) { if (S.groupMatches[i].id === matchId) { m = S.groupMatches[i]; break; } }
  if (!m) return;
  if (!m.events || !m.events.length) return;
  var ht = getTeamById(m.homeId), at = getTeamById(m.awayId);
  openModal('Clear all events?', '<div class="alert alert-info" style="border-color:var(--rdb);background:var(--rdbg)"><i class="ti ti-alert-triangle" style="color:var(--red)"></i><span>This clears <b>ALL</b> logged events (goals, cards, substitutions) for ' + (ht ? esc(ht.name) : '?') + ' vs ' + (at ? esc(at.name) : '?') + '. This cannot be undone, though it will stay in the audit trail.</span></div>',
    '<button class="btn" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="closeModal();confirmClearAllEvents(\'' + matchId + '\')"><i class="ti ti-trash"></i> Clear all</button>');
}
function confirmClearAllEvents(matchId) {
  var m = null;
  for (var i = 0; i < S.groupMatches.length; i++) { if (S.groupMatches[i].id === matchId) { m = S.groupMatches[i]; break; } }
  if (!m) return;
  var ht = getTeamById(m.homeId), at = getTeamById(m.awayId);
  var clearedCount = m.events.length;
  m.events = [];
  syncPlayedMatchAfterEventChange(m);
  logAudit('All events cleared', clearedCount + ' event(s) removed \u2014 ' + (ht ? ht.name : '?') + ' vs ' + (at ? at.name : '?'), m.id);
  render();
  showToast('Events cleared');
}

        + '<div style="display:flex;gap:6px;flex-shrink:0">'

        + '<button class="btn sm danger" onclick="deleteTickler(\'' + m.id + '\',\'' + t.id + '\')" title="Delete"><i class="ti ti-trash"></i></button>'
        + '</div></div>';
    }

    html += '<div style="font-size:var(--fs14);color:var(--tm)">No notebook photos uploaded yet. Use the Tickler Upload tile to attach a photo of your match notes.</div>';
  }

function openTicklerUpload(matchId) {
  openModal('Tickler Upload', '<div style="font-size:var(--fs14);color:var(--tm);margin-bottom:12px">Attach a photo of your notebook or written match notes. Useful as a backup record of goals, cards, and timings taken during the game.</div>'
    + '<div class="field"><label>Note <span style="color:var(--tm);font-weight:400">(optional)</span></label><input id="m-tickler-note" placeholder="e.g. First half notes"></div>'
    + '<input type="file" id="m-tickler-file" style="display:none" accept="image/*" capture="environment" onchange="handleTicklerFile(this)">'
    + '<button class="btn" onclick="document.getElementById(\'m-tickler-file\').click()"><i class="ti ti-camera"></i> Take / choose photo</button>'
    + '<div id="m-tickler-filename" style="font-size:var(--fs13);color:var(--tm);margin-top:6px"></div>',
    '<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="submitTicklerUpload(\'' + matchId + '\')"><i class="ti ti-check"></i> Upload</button>');
}
function handleTicklerFile(inputEl) {
  var file = inputEl.files && inputEl.files[0];
  var fnEl = el('m-tickler-filename');
  if (file && fnEl) fnEl.textContent = file.name + ' (' + Math.round(file.size / 1024) + ' KB)';
}
function submitTicklerUpload(matchId) {
  var m = null;
  for (var i = 0; i < S.groupMatches.length; i++) { if (S.groupMatches[i].id === matchId) { m = S.groupMatches[i]; break; } }
  if (!m) return;
  var fileEl = el('m-tickler-file');
  var file = fileEl.files && fileEl.files[0];
  if (!file) { showToast('Choose or take a photo first'); return; }
  var note = (el('m-tickler-note').value || '').trim();
  if (!m.ticklers) m.ticklers = [];
  var ref = S.activeRefereeId ? getRefereeById(S.activeRefereeId) : null;
  var entry = {
    id: 'tick_' + uid(),
    note: note,
    fileName: file.name,
    fileData: '',
    mimeType: file.type || 'image/jpeg',
    uploadedAt: new Date().toISOString(),
    uploadedBy: (ref && ref.name) || (AUTH && AUTH.name) || 'Referee'
  };
  var finish = function () {
    m.ticklers.push(entry);
    var ht = getTeamById(m.homeId), at = getTeamById(m.awayId);
    logAudit('Tickler uploaded', (ht ? ht.name : '?') + ' vs ' + (at ? at.name : '?') + (note ? (' \u2014 ' + note) : ''), m.id);
    closeModal();
    render();
    showToast('Notebook photo uploaded');
  };
  if (typeof FileReader !== 'undefined' && file.size <= 8 * 1024 * 1024) {
    var reader = new FileReader();
    reader.onload = function (ev) { entry.fileData = ev.target.result; finish(); };
    reader.onerror = function () { finish(); };
    reader.readAsDataURL(file);
  } else { finish(); }
}
function findTickler(matchId, ticklerId) {
  for (var i = 0; i < S.groupMatches.length; i++) {
    if (S.groupMatches[i].id !== matchId) continue;
    var list = S.groupMatches[i].ticklers || [];
    for (var j = 0; j < list.length; j++) { if (list[j].id === ticklerId) return { match: S.groupMatches[i], tickler: list[j] }; }
  }
  return null;
}
function viewTickler(matchId, ticklerId) {
  var found = findTickler(matchId, ticklerId);
  if (!found) { showToast('Photo not found'); return; }
  var t = found.tickler;
  if (!t.fileData) { showToast('No preview available for this photo'); return; }
  openModal(esc(t.note || 'Notebook photo'),
    '<img src="' + t.fileData + '" style="max-width:100%;border-radius:8px;display:block;margin:0 auto">'
    + '<div style="font-size:var(--fs13);color:var(--tm);text-align:center;margin-top:8px">' + esc(t.uploadedBy || '') + ' \u00b7 ' + new Date(t.uploadedAt).toLocaleString() + '</div>',
    '<button class="btn" onclick="closeModal()">Close</button><a class="btn primary" href="' + t.fileData + '" download="' + esc(t.fileName) + '" style="text-decoration:none;display:inline-flex;align-items:center;gap:6px"><i class="ti ti-cloud-download"></i> Download</a>');
}
function deleteTickler(matchId, ticklerId) {
  var found = findTickler(matchId, ticklerId);
  if (!found) return;
  openModal('Delete photo?', '<div class="alert alert-info" style="border-color:var(--rdb);background:var(--rdbg)"><i class="ti ti-alert-triangle" style="color:var(--red)"></i><span>Remove "' + esc(found.tickler.note || found.tickler.fileName) + '"? This cannot be undone.</span></div>',
    '<button class="btn" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="closeModal();confirmDeleteTickler(\'' + matchId + '\',\'' + ticklerId + '\')"><i class="ti ti-trash"></i> Delete</button>');
}
function confirmDeleteTickler(matchId, ticklerId) {
  var found = findTickler(matchId, ticklerId);
  if (!found) return;
  var out = [];
  for (var i = 0; i < found.match.ticklers.length; i++) { if (found.match.ticklers[i].id !== ticklerId) out.push(found.match.ticklers[i]); }
  found.match.ticklers = out;
  logAudit('Tickler removed', found.tickler.fileName, matchId);
  render();
  showToast('Photo removed');
}

function adjustScore(side, delta) {
  var m = null;
  for (var i = 0; i < S.groupMatches.length; i++) { if (S.groupMatches[i].id === S.currentMatchId) { m = S.groupMatches[i]; break; } }

    var targetId = side === 'home' ? m.homeId : m.awayId;
    for (var j = m.events.length - 1; j >= 0; j--) {
      if (m.events[j].teamId === targetId && (m.events[j].type === 'goal' || m.events[j].type === 'penalty_goal')) { m.events.splice(j, 1); break; }

/* Quick score nudge for a LIVE match from the Officials table (admin / official
   assisting the referee). Unlike openMatchEdit()+saveMatchScore(), this does
   NOT mark the match as played, so an in-progress game is never accidentally
   ended by someone assisting from the sidelines. Still logged to the audit
   trail under the acting user's name via logAudit(). */
function officialAdjustScore(mid, side, delta) {
  var m = null;
  for (var i = 0; i < S.groupMatches.length; i++) { if (S.groupMatches[i].id === mid) { m = S.groupMatches[i]; break; } }
  if (!m) return;
  if (delta > 0) {
    m.events.push({ id: uid(), type: 'goal', teamId: side === 'home' ? m.homeId : m.awayId, player: '(manual \u2014 official)', minute: 0 });
  } else {
    var targetId = side === 'home' ? m.homeId : m.awayId;
    for (var j = m.events.length - 1; j >= 0; j--) {
      if (m.events[j].teamId === targetId && (m.events[j].type === 'goal' || m.events[j].type === 'penalty_goal')) { m.events.splice(j, 1); break; }
    }

  var htA = getTeamById(m.homeId), atA = getTeamById(m.awayId);

  logAudit('Live score adjusted (Officials table)', (htA ? htA.name : '?') + ' ' + scA.hs + '\u2013' + scA.as + ' ' + (atA ? atA.name : '?'), mid);

function removeEvent(evId) {

  return html;
}
function buildSecOptions() {

  var html = '';
  for (var s = 0; s < 60; s++) { html += '<option value="' + s + '"' + (s === curSec ? ' selected' : '') + '>' + String(s).padStart(2, '0') + '</option>'; }

  var sec = secEl ? parseInt(secEl.value) || 0 : 0;
  S.timerSeconds = min * 60 + sec;
  S.timerStarted = true;
  logAudit('Timer adjusted', 'Set to ' + String(min).padStart(2, '0') + ':' + String(sec).padStart(2, '0') + ' remaining', S.currentMatchId);

function wheelAdjust(ev, selectEl) {
  ev.preventDefault();
  var dir = ev.deltaY > 0 ? -1 : 1;
  var idx = selectEl.selectedIndex;
  var newIdx = idx - dir;
  if (newIdx < 0) newIdx = 0;
  if (newIdx >= selectEl.options.length) newIdx = selectEl.options.length - 1;
  selectEl.selectedIndex = newIdx;
  setTimerFromSelects();
}
function toggleTimer() {
  if (S.timerRunning) { clearInterval(S.timerInterval); S.timerRunning = false; }
  else {
    S.timerRunning = true;
    S.timerStarted = true;
    S.onBreak = null;
    S.timerInterval = setInterval(function () {
      S.timerSeconds--;
      var disp = Math.max(S.timerSeconds, 0);
      var minEl = el('timer-min-select');
      var secEl = el('timer-sec-select');
      if (minEl) minEl.value = Math.floor(disp / 60);
      if (secEl) secEl.value = disp % 60;
      updateInjuryTimeUI();
    }, 1000);
  }
  render();
}

/* Pause the clock for an in-play break (half-time or hydration) and log it */
function takeBreak(kind, label) {
  if (S.timerRunning) { clearInterval(S.timerInterval); S.timerRunning = false; }
  S.onBreak = kind;
  logAudit(label, label + ' started at ' + elapsedMinute() + '\'', S.currentMatchId);
  showToast(label + ' \u2014 timer paused');
  render();
}
function halfTimeBreak() { takeBreak('halftime', 'Half-time'); }
function hydrationBreak() { takeBreak('hydration', 'Hydration break'); }
function timerStatusLabel() {
  if (S.timerRunning) return 'Running';
  if (S.onBreak === 'halftime') return 'Half-Time';
  if (S.onBreak === 'hydration') return 'Hydration break';
  return 'Paused';
}
/* Start / Pause / Resume \u2014 distinguishes "never started" from
   "paused partway through" so the button reads correctly either way. */
function timerButtonLabel() {
  if (S.timerRunning) return 'Pause';
  if (S.timerStarted) return 'Resume';
  return 'Start';
}
/* Logging any in-play event can pause the clock \u2014 the referee is asked,
   rather than it happening silently \u2014 except Default/DQ, which is an
   administrative match-ending action rather than an in-play event. */
function pauseForEvent() {
  if (!S.timerRunning) return;
  if (confirm('Pause the match timer for this event?')) {
    clearInterval(S.timerInterval);
    S.timerRunning = false;
  }
}

/* Timer now counts DOWN from the match duration. S.timerSeconds holds the
   seconds REMAINING (can go negative once regulation time is up, which is
   how injury/stoppage time is tracked). elapsedMinute() converts that back
   to "minute of the match" for event timestamps and audit logging. */
/* The timer is only ever "live" for one match at a time (S.timerSeconds /
   timerRunning / timerStarted), but a referee can switch between matches
   on the selector dropdown. Whenever the match being viewed changes, save
   the outgoing match's timer state onto the match object itself, and load
   (or freshly initialize) the incoming match's state \u2014 otherwise a match
   that was never started would incorrectly inherit "Resume" from whatever
   match was last being timed. */
function syncTimerToCurrentMatch() {
  if (S.timerMatchId === S.currentMatchId) return;
  if (S.timerMatchId) {
    var outgoing = null;
    for (var i = 0; i < S.groupMatches.length; i++) { if (S.groupMatches[i].id === S.timerMatchId) { outgoing = S.groupMatches[i]; break; } }
    if (outgoing) { outgoing.timerRemaining = S.timerSeconds; outgoing.timerStarted = S.timerStarted; }
  }
  if (S.timerRunning) { clearInterval(S.timerInterval); S.timerRunning = false; }
  var incoming = null;
  for (var j = 0; j < S.groupMatches.length; j++) { if (S.groupMatches[j].id === S.currentMatchId) { incoming = S.groupMatches[j]; break; } }
  if (incoming && incoming.timerStarted) {
    S.timerSeconds = (typeof incoming.timerRemaining === 'number') ? incoming.timerRemaining : (S.tournament.duration || 60) * 60;
    S.timerStarted = true;
  } else {
    S.timerSeconds = (S.tournament.duration || 60) * 60;
    S.timerStarted = false;
  }
  S.timerMatchId = S.currentMatchId;
}
function elapsedMinute() {
  var regulation = (S.tournament.duration || 60) * 60;
  return Math.floor((regulation - S.timerSeconds) / 60);
}
function isInjuryTime() { return S.timerSeconds <= 0; }
function injuryMinutes() {
  if (S.timerSeconds > 0) return 0;
  return Math.floor(-S.timerSeconds / 60) + 1;
}
function updateInjuryTimeUI() {
  var inInjury = isInjuryTime();
  var mins = [el('timer-min-select'), el('timer-sec-select')];
  for (var i = 0; i < mins.length; i++) {
    if (!mins[i]) continue;
    mins[i].style.color = inInjury ? 'var(--red)' : 'var(--gold)';

/* ---------------- SHEETS SYNC ---------------- */
function apiUrlBuild(action, extra) {
  var base = SCRIPT_URL + '?action=' + action + '&email=' + encodeURIComponent(AUTH.email);
  if (extra) base = base + extra;
  return base;
}
function apiFetch(action, extra, callback) {
  if (!SCRIPT_URL) { callback(null, 'SCRIPT_URL not configured'); return; }
  var url = apiUrlBuild(action, extra);
  fetch(url)
    .then(function (r) { return r.json(); })
    .then(function (d) { callback(d, null); })
    .catch(function (e) { callback(null, e.message); });
}
/* Saving goes via POST with the state in the request body, not a GET query
   string \u2014 a full tournament's state (plus any uploaded document/tickler
   photos) can easily run into the tens of thousands of characters, which
   silently fails or gets truncated as a URL. Apps Script Web Apps accept
   POST bodies with no such practical limit. */
function apiPost(action, payload, callback) {
  if (!SCRIPT_URL) { callback(null, 'SCRIPT_URL not configured'); return; }
  var url = SCRIPT_URL + '?action=' + action + '&email=' + encodeURIComponent(AUTH.email);
  fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids a CORS preflight against Apps Script
    body: JSON.stringify(payload)
  })
    .then(function (r) { return r.json(); })
    .then(function (d) { callback(d, null); })
    .catch(function (e) { callback(null, e.message); });
}
function autoSave() {
  if (AUTH.signedIn && SCRIPT_URL && (AUTH.role === 'admin' || AUTH.role === 'referee' || AUTH.role === 'official')) {

function pushToSheetsQuiet() {

/* ============================================================
   REAL TENANT AUTH + DATA SYNC (Supabase). See the sb/TENANT_ORG
   comment near the top of this script for what this does and does not
   touch. Every function here is a no-op if sb is null (library failed to
   load / offline) or if the lookups come back empty — falls through to
   whatever the existing local/demo behavior already does, never throws.
   ============================================================ */
function completeSupabaseLogin_(session) {
  if (!sb || !session || !session.user || !session.user.email) return;
  /* A persisted real session's INITIAL_SESSION event fires on every page
     load, including while the synchronous demo-tenant boot code (further
     down this file) has already swapped S into a demo org's state a tick
     earlier. Never let this overwrite that — demo tenants stay fully
     local no matter what real session exists in the background. */
  if (S && S._demoOrg) return;
  var email = session.user.email.toLowerCase();
  sb.from('platform_admins').select('email').eq('email', email).maybeSingle().then(function(res){
    if (res.data) {
      IS_PLATFORM_ADMIN_SESSION = true;
      AUTH.email = email;
      showSuperadminConsole();
      return;
    }
    sb.from('org_members').select('org_id,role').eq('email', email).limit(1).maybeSingle().then(function(res2){
      if (!res2.data) {
        showLoginError('Signed in as ' + email + ', but no tenant membership was found. Contact your platform admin.');
        return;
      }
      sb.from('organizations').select('*').eq('id', res2.data.org_id).maybeSingle().then(function(orgRes){
        if (orgRes.data && orgRes.data.status === 'suspended') {
          showTenantPausedScreen_(orgRes.data);
          return;
        }
        TENANT_ORG = orgRes.data || null;
        loadTenantTournament_(res2.data.org_id, res2.data.role, email);
      });
    });
  });
}
/* An org can run more than one tournament at once (tournaments.org_id has
   no unique constraint, by design). If the URL named a specific one
   (PENDING_TENANT_SLUG, from /t/{org-slug}/{tournament-slug}) load that;
   otherwise auto-pick when there's exactly one, or ask when there are
   several — never guess which one someone meant. */
function loadTenantTournament_(orgId, role, email) {
  if (!sb) return;
  var q = sb.from('tournaments').select('*').eq('org_id', orgId);
  if (PENDING_TENANT_SLUG) q = q.eq('slug', PENDING_TENANT_SLUG);
  var slugUsed = PENDING_TENANT_SLUG;
  PENDING_TENANT_SLUG = null;
  q.then(function(res){
    var rows = res.data || [];
    if (!slugUsed && rows.length > 1) { renderTournamentPicker_(rows, orgId, role, email); return; }
    var row = rows[0] || null;
    if (slugUsed && !row) { showLoginError('That tournament link is no longer valid. Ask your platform admin for the current link.'); return; }
    enterTenantTournament_(row, orgId, role, email);
  });
}
function enterTenantTournament_(row, orgId, role, email) {
  if (row && row.data && Object.keys(row.data).length) { swapStateInPlace_(row.data); }
  if (row) { S._tournamentMeta.name = row.name; }
  S._tenantOrgId = orgId;
  S._tenantTournamentId = row ? row.id : null;
  AUTH.signedIn = true;
  AUTH.email = email;
  AUTH.name = (TENANT_ORG && TENANT_ORG.name ? TENANT_ORG.name + ' — ' : '') + email;
  AUTH.role = role;
  S.role = role;
  S.page = NAV[role] ? NAV[role][0].p : 'schedule';
  var sWrap = el('signin-wrap'); if (sWrap) sWrap.innerHTML = '';
  var aEl = el('app-shell'); if (aEl) aEl.style.display = 'flex';
  updateUserBadge();
  renderRoleViewAs();
  renderSyncActions();
  renderNav();
  render();
  showToast('Signed in' + (row ? ' — ' + row.name + ' loaded' : ''));
}
var PENDING_TENANT_PICKER_ = null;
function renderTournamentPicker_(tournaments, orgId, role, email) {
  PENDING_TENANT_PICKER_ = { tournaments: tournaments, orgId: orgId, role: role, email: email };
  var sWrap = el('signin-wrap');
  if (!sWrap) return;

function renderAccessRequests() {
  var pending = 0;
  for (var i = 0; i < S.accessRequests.length; i++) { if (S.accessRequests[i].status === 'pending') pending++; }
  setTopbar('Access Requests', pending + ' pending review');
  if (!S.accessRequests.length) { el('main-content').innerHTML = '<div class="empty"><i class="ti ti-user-plus"></i><p>No access requests yet.</p></div>'; return; }
  var order = { pending: 0, approved: 1, rejected: 2 };
  var sorted = S.accessRequests.slice().sort(function (a, b) { return order[a.status] - order[b.status]; });
  var html = '';
  for (var s = 0; s < sorted.length; s++) {
    var r = sorted[s];
    var statusBadge = r.status === 'pending' ? '<span class="badge bamb">Pending</span>' : (r.status === 'approved' ? '<span class="badge bg">Approved</span>' : '<span class="badge brd">Rejected</span>');
    html += '<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">'
      + '<div><div style="font-weight:600">' + esc(r.name) + '</div><div style="font-size:var(--fs13);color:var(--tm)">' + esc(r.email) + (r.phone ? (' \u00b7 ' + esc(r.phone)) : '') + ' \u00b7 Requesting: ' + esc(REQUEST_ACCESS_ROLES[r.role] || r.role) + '</div></div>'
      + statusBadge + '</div>'
      + (r.notes ? ('<div style="font-size:var(--fs14);color:var(--tm);margin-bottom:8px">' + esc(r.notes) + '</div>') : '')
      + (r.status === 'pending' ? ('<div style="display:flex;gap:8px"><button class="btn primary sm" onclick="approveAccessRequest(\'' + r.id + '\')"><i class="ti ti-check"></i> Approve</button><button class="btn sm danger" onclick="rejectAccessRequest(\'' + r.id + '\')"><i class="ti ti-x"></i> Reject</button></div>')
        : (r.status === 'rejected' && r.rejectReason ? ('<div style="font-size:var(--fs13);color:var(--red)">Reason: ' + esc(r.rejectReason) + '</div>') : ''))
      + '</div>';
  }
  el('main-content').innerHTML = html;
}
function approveAccessRequest(id) {
  var r = null;
  for (var i = 0; i < S.accessRequests.length; i++) { if (S.accessRequests[i].id === id) { r = S.accessRequests[i]; break; } }
  if (!r) return;
  var u = defaultUser();
  u.name = r.name; u.email = r.email; u.role = r.role;
  if (r.role === 'referee') {
    var ref = defaultReferee();
    ref.name = r.name; ref.phone = r.phone;
    S.referees.push(ref);
    u.linkedRefereeId = ref.id;
  }
  S.users.push(u);
  r.status = 'approved';
  logAudit('Access request approved', r.name + ' \u2014 ' + (REQUEST_ACCESS_ROLES[r.role] || r.role) + ' account created', null);
  render();
  renderNav();
  showToast('Approved \u2014 account created, they can now sign in');
}
function rejectAccessRequest(id) {
  var r = null;
  for (var i = 0; i < S.accessRequests.length; i++) { if (S.accessRequests[i].id === id) { r = S.accessRequests[i]; break; } }
  if (!r) return;
  var reason = prompt('Reason for rejection (optional):') || '';
  r.status = 'rejected';
  r.rejectReason = reason;
  logAudit('Access request rejected', r.name + (reason ? (' \u2014 ' + reason) : ''), null);
  render();
  showToast('Request rejected');
}

var SUPERADMIN_TAB = 'directory';
function saSetTab(tab){ SUPERADMIN_TAB = tab; renderSuperadmin(); }

var SA_EXPANDED_SLUG = null;
