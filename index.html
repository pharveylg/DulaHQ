/* Dual-mode: IS_PLATFORM_ADMIN_SESSION (a real, completed Supabase login
   that resolved against platform_admins) reads/writes the real
   organizations table; otherwise falls back to the existing local/demo
   directory below, completely unchanged. SA_REAL_ORGS is a simple
   fetch-once-then-cache — actions that mutate clear it so the next
   render refetches instead of trusting a stale local copy. */
var SA_REAL_ORGS = null;
function renderSaDirectory_(){
  if (IS_PLATFORM_ADMIN_SESSION && sb) {
    if (SA_REAL_ORGS === null) {
      sb.from('organizations').select('*').order('created_at').then(function(res){
        SA_REAL_ORGS = res.data || [];
        renderSuperadmin();
      });
      return '<div class="card"><div class="card-title"><i class="ti ti-list-details"></i>Tenant Directory</div><div class="empty"><p>Loading tenants…</p></div></div>';
    }
    return renderSaDirectoryRows_(SA_REAL_ORGS, true);
  }
  return renderSaDirectoryRows_(getTenantDirectory(), false);
}
function renderSaDirectoryRows_(dir, isReal){
  var html = '<div class="card"><div class="card-title"><i class="ti ti-list-details"></i>Tenant Directory'
    + '<span class="badge ' + (isReal ? 'b-green' : 'b-amber') + '" style="margin-left:auto">' + (isReal ? 'Live backend' : 'Local/demo directory') + '</span></div>';
  if (!dir.length) { html += '<div class="empty"><p>No tenants yet — provision one to get started.</p></div></div>'; return html; }
  for (var i = 0; i < dir.length; i++) {
    var t = dir[i];
    var key = isReal ? t.id : t.slug; /* real mutations need the uuid PK, not the slug */
    var suspended = t.status === 'suspended';
    html += '<div class="sa-row">';
    html += '<span class="sa-swatch" style="background:' + esc(t.accent || '#999') + '"></span>';
    html += '<div style="flex:1;min-width:0"><div style="font-weight:600">' + esc(t.name) + ' ' + (suspended ? '<span class="badge b-amber">Suspended</span>' : '<span class="badge b-green">Active</span>') + '</div>';
    html += '<div style="font-size:var(--fs12);color:var(--tm)">/t/' + esc(t.slug) + '</div></div>';
    html += '<button class="btn sm" onclick="window.open(location.origin+\'/t/' + esc(t.slug) + '\',\'_blank\')"><i class="ti ti-external-link"></i> Open</button>';
    html += '<button class="btn sm" onclick="saToggleManage(\'' + esc(key) + '\')"><i class="ti ti-settings"></i> Manage</button>';
    html += '<button class="btn sm' + (suspended ? ' primary' : '') + '" onclick="' + (isReal ? 'saToggleSuspendReal_' : 'saToggleSuspend') + '(\'' + esc(key) + '\')">' + (suspended ? 'Activate' : 'Suspend') + '</button>';
    html += '</div>';
    if (SA_EXPANDED_SLUG === key) {
      html += '<div style="padding:14px;background:var(--n3);border-radius:8px;margin:-4px 0 10px">';
      html += '<div class="field"><label>Business name</label><input id="sa-name-' + esc(key) + '" value="' + esc(t.name) + '"></div>';
      html += '<div class="field"><label>Accent color</label><input id="sa-color-' + esc(key) + '" type="color" value="' + esc(t.accent || '#15803D') + '" style="width:70px;padding:2px;height:38px"></div>';
      html += '<button class="btn primary sm" onclick="' + (isReal ? 'saSaveManageReal_' : 'saSaveManage') + '(\'' + esc(key) + '\')"><i class="ti ti-check"></i> Save</button>';
      if (isReal) html += renderSaTournaments_(key);
      html += '</div>';
    }
  }
  html += '</div>';
  return html;
}

/* Tournaments for a real org — separate cache keyed by org id, same
   fetch-once-then-cache/invalidate-on-mutate pattern as SA_REAL_ORGS.
   Local/demo mode has no equivalent: a demo org only ever has the one
   tournament baked into its seed data. */
function newTournamentId_(){
  return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('t-' + Date.now() + '-' + Math.random().toString(36).slice(2));
}
var SA_REAL_TOURNAMENTS = {};
function renderSaTournaments_(orgId){
  var html = '<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--nb)">';
  html += '<div style="font-weight:600;font-size:var(--fs13);text-transform:uppercase;letter-spacing:1px;color:var(--tm);margin-bottom:10px">Tournaments</div>';
  var list = SA_REAL_TOURNAMENTS[orgId];
  if (list === undefined) {
    SA_REAL_TOURNAMENTS[orgId] = null;
    sb.from('tournaments').select('*').eq('org_id', orgId).order('created_at').then(function(res){
      SA_REAL_TOURNAMENTS[orgId] = res.data || [];
      renderSuperadmin();
    });
    html += '<div class="empty"><p>Loading…</p></div>';
  } else if (list === null) {
    html += '<div class="empty"><p>Loading…</p></div>';
  } else {
    if (!list.length) html += '<div class="empty"><p>No tournaments yet.</p></div>';
    for (var i = 0; i < list.length; i++) {
      var trn = list[i];
      html += '<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">';
      html += '<input id="sa-trn-name-' + esc(trn.id) + '" value="' + esc(trn.name) + '" placeholder="Tournament name" style="flex:1">';
      html += '<input id="sa-trn-slug-' + esc(trn.id) + '" value="' + esc(trn.slug || '') + '" placeholder="slug (if 2+ tournaments)" style="flex:1">';
      html += '<button class="btn sm" onclick="saSaveTournamentReal_(\'' + esc(orgId) + '\',\'' + esc(trn.id) + '\')"><i class="ti ti-check"></i></button>';
      html += '</div>';
    }
    html += '<div style="display:flex;gap:8px;align-items:center;margin-top:10px">';
    html += '<input id="sa-new-trn-name-' + esc(orgId) + '" placeholder="New tournament name" style="flex:1">';
    html += '<input id="sa-new-trn-slug-' + esc(orgId) + '" placeholder="slug (required if adding another)" style="flex:1">';
    html += '<button class="btn sm" onclick="saAddTournamentReal_(\'' + esc(orgId) + '\')"><i class="ti ti-plus"></i> Add</button>';
    html += '</div>';
  }
  html += '</div>';
  return html;
}
function saAddTournamentReal_(orgId){
  var nameEl = el('sa-new-trn-name-' + orgId), slugEl = el('sa-new-trn-slug-' + orgId);
  var name = (nameEl.value || '').trim();
  var slug = (slugEl.value || '').trim().toLowerCase();
  var existing = SA_REAL_TOURNAMENTS[orgId] || [];
  if (!name) { showToast('Tournament name is required.'); return; }
  if (existing.length >= 1 && !slug) { showToast('A slug is required once an organizer has more than one tournament.'); return; }
  if (slug && !/^[a-z0-9-]+$/.test(slug)) { showToast('Slug must be lowercase letters, numbers, and hyphens only.'); return; }
  sb.from('tournaments').insert({ id: newTournamentId_(), org_id: orgId, name: name, slug: slug || null }).then(function(res){
    if (res.error) { showToast('Add failed: ' + res.error.message); return; }
    SA_REAL_TOURNAMENTS[orgId] = undefined;
    renderSuperadmin();
    showToast('Tournament "' + name + '" added');
  });
}
function saSaveTournamentReal_(orgId, trnId){
  var nameEl = el('sa-trn-name-' + trnId), slugEl = el('sa-trn-slug-' + trnId);
  var name = (nameEl.value || '').trim();
  var slug = (slugEl.value || '').trim().toLowerCase();
  if (!name) { showToast('Tournament name is required.'); return; }
  if (slug && !/^[a-z0-9-]+$/.test(slug)) { showToast('Slug must be lowercase letters, numbers, and hyphens only.'); return; }
  sb.from('tournaments').update({ name: name, slug: slug || null }).eq('id', trnId).then(function(res){
    if (res.error) { showToast('Update failed: ' + res.error.message); return; }
    SA_REAL_TOURNAMENTS[orgId] = undefined;
    renderSuperadmin();
    showToast('Tournament updated');
  });
}

function saToggleSuspend(slug){
  var dir = getTenantDirectory();
  for (var i = 0; i < dir.length; i++) { if (dir[i].slug === slug) { dir[i].status = (dir[i].status === 'suspended') ? 'active' : 'suspended'; break; } }
  saveTenantDirectory(dir);
  renderSuperadmin();
}
function saSaveManage(slug){
  var nameEl = el('sa-name-' + slug), colorEl = el('sa-color-' + slug);
  var dir = getTenantDirectory();
  for (var i = 0; i < dir.length; i++) {
    if (dir[i].slug === slug) {
      if (nameEl && nameEl.value.trim()) dir[i].name = nameEl.value.trim();
      if (colorEl) dir[i].accent = colorEl.value;
      break;
    }
  }
  saveTenantDirectory(dir);
  SA_EXPANDED_SLUG = null;
  renderSuperadmin();
  showToast('Tenant updated');
}
function saToggleSuspendReal_(orgId){
  var org = null;
  for (var i = 0; i < (SA_REAL_ORGS||[]).length; i++) { if (SA_REAL_ORGS[i].id === orgId) { org = SA_REAL_ORGS[i]; break; } }
  if (!org) return;
  var next = (org.status === 'suspended') ? 'active' : 'suspended';
  sb.from('organizations').update({ status: next }).eq('id', orgId).then(function(res){
    if (res.error) { showToast('Update failed: ' + res.error.message); return; }
    SA_REAL_ORGS = null; /* force refetch so the directory reflects the real row */
    renderSuperadmin();
  });
}
function saSaveManageReal_(orgId){
  var nameEl = el('sa-name-' + orgId), colorEl = el('sa-color-' + orgId);
  var patch = {};
  if (nameEl && nameEl.value.trim()) patch.name = nameEl.value.trim();
  if (colorEl) patch.accent = colorEl.value;
  sb.from('organizations').update(patch).eq('id', orgId).then(function(res){
    if (res.error) { showToast('Update failed: ' + res.error.message); return; }
    SA_EXPANDED_SLUG = null;
    SA_REAL_ORGS = null;
    renderSuperadmin();
    showToast('Tenant updated');
  });
}

function renderSaProvision_(){

/* Seeds numTeams fake teams + a real groups+knockout draw (via the app's
   own generateDraw()) into a category, then marks playFraction of the
   group matches as played with plausible scores. Returns the list of
   still-unplayed matches, so the caller can pick one to mark "live". */
function seedDemoCategory_(cat, numTeams, numGroups, playFraction) {
  var usedNames = {};
  for (var i = 0; i < numTeams; i++) { cat.teams.push(buildDemoTeamObj_(usedNames)); }
  var savedActive = S.activeCategoryId;
  S.activeCategoryId = cat.id;
  cat.structure = 'groups_knockout';
  cat.numGroups = numGroups;
  generateDraw();
  var teamById = {};
  for (var ti = 0; ti < cat.teams.length; ti++) { teamById[cat.teams[ti].id] = cat.teams[ti]; }
  var toPlay = Math.floor(cat.groupMatches.length * playFraction);
  for (var m = 0; m < toPlay; m++) {
    var match = cat.groupMatches[m];
    match.homeScore = Math.floor(Math.random() * 5);
    match.awayScore = Math.floor(Math.random() * 5);
    match.played = true;
    match.verified = true;
    match.events = [];
    var homeTeam = teamById[match.homeId], awayTeam = teamById[match.awayId];
    seedGoalEvents_(match, match.homeId, match.homeScore, homeTeam);
    seedGoalEvents_(match, match.awayId, match.awayScore, awayTeam);
    if (Math.random() < 0.3) seedCardEvent_(match, match.homeId, homeTeam);
    if (Math.random() < 0.3) seedCardEvent_(match, match.awayId, awayTeam);
    match.events.sort(function (a, b) { return a.minute - b.minute; });
  }
  S.activeCategoryId = savedActive;
  var unplayed = [];
  for (var j = 0; j < cat.groupMatches.length; j++) { if (!cat.groupMatches[j].played) unplayed.push(cat.groupMatches[j]); }
  return unplayed;
}
function seedGoalEvents_(match, teamId, count, team) {
  if (!team || !team.players.length) return;
  for (var g = 0; g < count; g++) {
    var scorer = demoPick(team.players);
    match.events.push({ id: uid(), type: 'goal', teamId: teamId, player: scorer.name, minute: 1 + Math.floor(Math.random() * 89) });
  }
}
function seedCardEvent_(match, teamId, team) {
  if (!team || !team.players.length) return;
  var player = demoPick(team.players);
  match.events.push({ id: uid(), type: 'yellow', teamId: teamId, player: player.name, minute: 1 + Math.floor(Math.random() * 89) });
}

    d2.name = 'Medical Certificate \u2014 ' + general.teams[1].players[0].name; d2.fileName = 'medical_cert.pdf'; d2.mimeType = 'application/pdf';
    d2.status = 'approved'; d2.reviewedBy = 'Admin'; d2.reviewedByRole = 'Admin';
    general.teams[1].documents = [d2];
  }

  // ---- Live stream, tagged to the live match ----
  if (generalUnplayed.length) {
    S.liveEmbeds.push({ id: 'live_' + uid(), categoryId: general.id, url: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ', label: 'Pitch 1 stream', matchId: generalUnplayed[0].id });
  }

  // ---- Audit history, so Audit Trail isn't empty on first look ----
  var histEvents = [
    ['Tournament created', 'Mindanao Cup 2026 \u2014 CDO Sports Complex'],
    ['Category created', 'General \u2014 Open division'],
    ['Category created', 'U14 Boys'],
    ['Category created', "Women's Open"],
    ['Draw generated', 'General \u2014 Groups + Knockout format'],
    ['Team approved', 'Butuan Falcons \u2014 General'],
    ['Officiating team member added', com3.name + ' \u2014 Match Commissioner'],
    ['Document uploaded', (general.teams[0] ? general.teams[0].name : 'Team') + ' \u2014 Birth Cert / ID (pending review)']
  ];
  for (var h = 0; h < histEvents.length; h++) {
    S.auditLog.unshift({ id: uid(), ts: new Date(Date.now() - (histEvents.length - h) * 3600000).toISOString(), role: 'admin', actor: 'Admin', action: histEvents[h][0], detail: histEvents[h][1], matchId: null });
  }
}
/* Sidebar "Demo" button \u2014 reseeds fresh demo data (only takes effect if
   S.users is currently empty; see the guard in seedDemoData) and drops
   the admin straight into the live match. */
function seedDemo() {
  S.users = []; // force a reseed even if this isn't the very first boot
  seedDemoData();
  S.role = 'admin';
  UI_DROPDOWN.viewas = false;
  UI_DROPDOWN.manage = false;
  renderRoleViewAs();
  renderSyncActions();
  renderNav();
  navTo('referee');
  showToast('Demo loaded \u2014 live match at 32\' on Pitch 1. Score it from the Referee tab!');
}

/* ---------------- BOOT ---------------- */
migrateLegacyData(); // creates one empty default category so the app has somewhere to start
seedDemoData(); // restores the full demo scenario + 4 test accounts. To
                 // go back to a genuinely empty production boot instead,
                 // swap this line for seedDefaultAdmin().
renderNav();
var sw = el('signin-wrap');
if (sw) sw.innerHTML = renderSignInPage();
hydrateIcons(document.body);
if (GOOGLE_CLIENT_ID) {
  window.addEventListener('load', function () {
    if (window.google && window.google.accounts) {
      google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleCredentialResponse });
      var btn = el('g-signin-btn');
      if (btn) google.accounts.id.renderButton(btn, { theme: 'outline', size: 'large', text: 'signin_with' });
      google.accounts.id.prompt();
    }
  });
}
</script>
<script>
/* =====================================================================
   PRE-LOADED DEMO TENANTS + SYSTEM RAIL (ported onto the cream base)
   — /t/{slug} boots a self-contained demo tenant; your real state is
   backed up and restored when you leave; backend sync is disabled while
   inside a demo tenant so demo data never reaches the sheet.
   ===================================================================== */
/* DEMO_ORGS below is the seed/default list. The Superadmin Console's
   Tenant Directory is the persisted, mutable version of it — renamed,
   recolored, suspended, or newly-provisioned tenants live in localStorage
   and every other reader of "which tenants exist" (the /t/{slug} boot
   handler, the demo banner, the console itself) goes through
   getTenantDirectory()/findTenant(), never DEMO_ORGS directly, so a
   change made in the console actually takes effect everywhere. */
var TENANT_DIR_LS = 'dulahq:platform-tenants';
function getTenantDirectory(){
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(TENANT_DIR_LS) || 'null'); } catch(e){}
  if (saved && saved.length) return saved;
  return DEMO_ORGS.slice();
}
function saveTenantDirectory(list){ try { localStorage.setItem(TENANT_DIR_LS, JSON.stringify(list)); } catch(e){} }
function findTenant(slug){
  var dir = getTenantDirectory();
  for (var i=0;i<dir.length;i++) if (dir[i].slug === slug) return dir[i];
  return null;
}
var DEMO_ORGS = [
  { slug:'usnagali', name:'Copa Gali Futbol', accent:'#CCFF00', admin:'pharveylg@gmail.com', status:'active',
    demo:{ stage:'complete', meta:{ name:'Copa Gali Futbol 2026', venue:'Gali Valley Sports Complex', date:'2026-05-09' } } },
  { slug:'copa-davao', name:'Copa Davao', accent:'#FF6B35', admin:'copa.davao@dulahq.test', status:'active',
    demo:{ stage:'complete', meta:{ name:'Copa Davao 2026', venue:'Davao Delta Fields', date:'2026-06-20' } } },
  { slug:'manila-summer', name:'Manila Summer Invitational', accent:'#3B82F6', admin:'msi@dulahq.test', status:'active',
    demo:{ stage:'complete', meta:{ name:'Manila Summer Invitational 2026', venue:'Rizal Memorial Coliseum', date:'2026-04-11' } } },
  { slug:'cebu-volley', name:'Cebu Volley Classic', accent:'#A855F7', admin:'volley@dulahq.test', status:'active',
    demo:{ stage:'group', meta:{ name:'Cebu Volley Classic 2026', venue:'Cebu Coliseum', date:'2026-08-22' } } },
  { slug:'davao-hoops', name:'Davao Hoops League', accent:'#F59E0B', admin:'hoops@dulahq.test', status:'active',
    demo:{ stage:'group', meta:{ name:'Davao Hoops League S2', venue:'Davao City Gym', date:'2026-08-29' } } }
];

/* In-place S swap that PRESERVES the category accessor proxies.
   Proxied fields (teams/groups/groupMatches/knockoutRounds/generated/
   bracketView/tournament) live inside next.categories — never delete or
   plain-assign those keys or per-category routing silently breaks. */
var S_PROXY_KEYS = { teams:1, groups:1, groupMatches:1, knockoutRounds:1, generated:1, bracketView:1, tournament:1 };
function swapStateInPlace_(next){
  try {
    for (var k in S){ if (Object.prototype.hasOwnProperty.call(S, k) && k !== 'timerInterval' && !S_PROXY_KEYS[k]) delete S[k]; }
    for (var k2 in next){ if (k2 !== 'timerInterval' && !S_PROXY_KEYS[k2]) S[k2] = next[k2]; }
  } catch(e){}
}
function demoSanitize_(st){ try { var c = JSON.parse(JSON.stringify(st)); c.timerInterval = null; return c; } catch(e){ return st; } }
var DEMO_S_TEMPLATE = (function(){ try { return JSON.parse(JSON.stringify(S)); } catch(e){ return null; } })();

function buildDemoState_(org){
  var st = DEMO_S_TEMPLATE ? JSON.parse(JSON.stringify(DEMO_S_TEMPLATE)) : { categories: [], users: [], referees: [] };
  st._tournamentMeta = { name: org.demo.meta.name, venue: org.demo.meta.venue, date: org.demo.meta.date, pitches: [], guestAccessEnabled: false };
  st.categories = []; st.users = []; st.referees = [];
  st._demoOrg = org.slug;
  swapStateInPlace_(st); /* mutate S in place — generateDraw()/proxy layer keep working */
  var frac = org.demo.stage === 'complete' ? 1 : 0.5;
  var c1 = defaultCategory(); c1.name = 'Open Division'; c1.ageGroup = 'Open';
  st.categories.push(c1);
  var unplayed = seedDemoCategory_(c1, 12, 4, frac);
  var c2 = defaultCategory(); c2.name = 'U16'; c2.ageGroup = 'U16';
  st.categories.push(c2);
  seedDemoCategory_(c2, 8, 2, frac);
  S.activeCategoryId = c1.id; /* on S itself — never the temp copy, or activeCategory() spawns a stray */
  var admin = defaultUser(); admin.name = 'Tournament Admin'; admin.email = org.admin || 'admin@dulahq.test'; admin.role = 'admin';
  st.users.push(admin);
  var ref = defaultReferee(); ref.name = 'Center Referee'; st.referees.push(ref);
  if (org.demo.stage !== 'complete' && unplayed && unplayed.length){
    var lm = unplayed[0];
    lm.inProgress = true; lm.homeScore = 1; lm.awayScore = 0; lm.refereeId = ref.id;
    st.timerSeconds = 28 * 60; st.timerStarted = true; st.timerRunning = false;
    st.timerMatchId = lm.id;
    try { st.currentMatchByCategory = st.currentMatchByCategory || {}; st.currentMatchByCategory[c1.id] = lm.id; } catch(e){}
  }
  return S;
}

function enterDemoOrg(org){
  try {
    if (S && S._demoOrg){
      try { localStorage.setItem('dulahq:demo-state:' + S._demoOrg, JSON.stringify(demoSanitize_(S))); } catch(e){}
    } else {
      try { if (!localStorage.getItem('dulahq:demo-backup')) localStorage.setItem('dulahq:demo-backup', JSON.stringify(demoSanitize_(S))); } catch(e){}
    }
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem('dulahq:demo-state:' + org.slug) || 'null'); } catch(e){}
    if (saved && saved._demoOrg === org.slug){ swapStateInPlace_(saved); }
    else { buildDemoState_(org); try { localStorage.setItem('dulahq:demo-state:' + org.slug, JSON.stringify(demoSanitize_(S))); } catch(e){} }
  } catch(e){ /* never block boot */ }
}
function leaveDemoOrgIfNeeded(){
  try {
    if (S && S._demoOrg){ try { localStorage.setItem('dulahq:demo-state:' + S._demoOrg, JSON.stringify(demoSanitize_(S))); } catch(e){} }
    var bk = null;
    try { bk = JSON.parse(localStorage.getItem('dulahq:demo-backup') || 'null'); } catch(e){}
    if (bk){ swapStateInPlace_(bk); try { localStorage.removeItem('dulahq:demo-backup'); } catch(e){} }
    try { var sn = el('sb-trn-name'); if (sn) sn.textContent = (S._tournamentMeta && S._tournamentMeta.name) || 'Dula HQ Tournament'; } catch(e){}
  } catch(e){}
}
function renderDemoBanner_(){
  try {
    var old = document.getElementById('org-banner'); if (old) old.remove();
    if (!S || !S._demoOrg) return;
    var org = findTenant(S._demoOrg);
    if (!org) return;
    var b = document.createElement('div'); b.id = 'org-banner';
    b.innerHTML = 'Viewing · ' + esc(org.name) + ' <button id="org-return">Return</button>';
    document.body.appendChild(b);
    document.getElementById('org-return').onclick = function(){
      try { leaveDemoOrgIfNeeded(); } catch(e){}
      location.href = location.origin + '/';
    };
  } catch(e){}
}
/* Shown instead of loading a tenant's demo data when the Superadmin
   Console has suspended it. Overwrites #signin-wrap (which lives outside
   #app-shell, so this shows regardless of auth state) and deliberately
   does NOT call enterDemoOrg — S is left untouched. */
function showTenantPausedScreen_(tenant){
  try {
    var sw = el('signin-wrap');
    if (!sw) return;
    sw.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);padding:20px">'
      + '<div style="background:var(--n2);border:1px solid var(--nb);border-radius:12px;padding:40px 32px;max-width:420px;width:100%;text-align:center;box-shadow:var(--shadow)">'
      + '<i class="ti ti-player-pause" style="font-size:var(--fs44);color:var(--tm)"></i>'
      + '<div style="font-size:var(--fs22);font-weight:700;margin:14px 0 8px">' + esc(tenant.name) + ' is paused</div>'
      + '<div style="font-size:var(--fs14);color:var(--tm);line-height:1.5">This tournament page has been temporarily suspended by the platform admin.</div>'
      + '</div></div>';
  } catch(e){}
}

/* Backend fence: while inside a demo tenant, every sync path no-ops.
   (autoSave/pushToSheetsQuiet fire implicitly; the other three are the
   header/rail/sheet buttons — all guarded here in one place.) */
(function(){
  function fence(name){
    var orig = window[name];
    if (typeof orig !== 'function') return;
    window[name] = function(){
      if (S && S._demoOrg){ try { showToast('Demo tenant — backend sync is disabled'); } catch(e){} return; }
      return orig.apply(this, arguments);
    };
  }
  fence('autoSave'); fence('pushToSheetsQuiet'); fence('pushToSheets'); fence('seedFromSheets'); fence('loadFromSheets');
})();

/* Light/dark toggle — cream default, warm-espresso dark; remembered per browser */
window.toggleTheme_ = function(){
  var r = document.documentElement;
  var dark = r.getAttribute('data-theme') === 'dark';
  if (dark) r.removeAttribute('data-theme'); else r.setAttribute('data-theme', 'dark');
  try { localStorage.setItem('dulahq-theme', dark ? 'light' : 'dark'); } catch(e){}
  var b = document.getElementById('ops-theme-tog');
  if (b) b.textContent = dark ? '\u{1F319}' : '\u2600\uFE0F';
};
(function(){
  function makeThemeBtn(){
    try {
      if (document.getElementById('ops-theme-tog')) return;
      var host = document.querySelector('.app-header-user');
      if (!host) return;
      var b = document.createElement('button');
      b.id = 'ops-theme-tog'; b.className = 'hdr-icon-btn'; b.type = 'button';
      b.title = 'Toggle light / dark theme'; b.setAttribute('aria-label', 'Toggle light or dark theme');
      b.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '\u2600\uFE0F' : '\u{1F319}';
      b.onclick = function(){ try { toggleTheme_(); } catch(e){} };
      host.insertBefore(b, host.firstChild);
    } catch(e){}
  }
  makeThemeBtn();
  document.addEventListener('DOMContentLoaded', makeThemeBtn);
  setInterval(makeThemeBtn, 3000);
})();

/* Mobile More sheet: System group (same functions the desktop rail buttons call) */
function demoSystemGroupHtml_(){
  try {
    if (typeof AUTH === 'undefined' || !AUTH || !AUTH.signedIn) return '';
    var h = '<div class="dropdown-group-label" style="margin-top:6px">System</div>';
    h += '<button class="nav-item" onclick="closeMobMoreSheet();toggleTheme_()"><i class="ti ti-sun-high"></i>Toggle light / dark</button>';
    h += '<button class="nav-item" onclick="closeMobMoreSheet();seedDemo()"><i class="ti ti-wand"></i>Demo data</button>';
    h += '<button class="nav-item" onclick="closeMobMoreSheet();loadFromSheets()"><i class="ti ti-cloud-download"></i>Refresh from backend</button>';
    if (AUTH.role === 'admin'){
      h += '<button class="nav-item" onclick="closeMobMoreSheet();pushToSheets()"><i class="ti ti-cloud-upload"></i>Save to backend</button>';
      h += '<button class="nav-item" onclick="closeMobMoreSheet();seedFromSheets()"><i class="ti ti-rotate"></i>Reset</button>';
    }
    return h;
  } catch(e){ return ''; }
}

/* Desktop rail: relocate View As / Refresh-Save-Reset / Demo / Sign out.
   Mobile keeps them in the header (status quo) + the More-sheet System group. */
var PORT_MQ = window.matchMedia('(max-width: 1024px)');
var CTRL_HOME = [], TB_HOME = null;
function railControls(){
  var out = [], nd;
  nd = document.getElementById('viewas-dropdown-wrap'); if (nd) out.push(nd);
  nd = document.getElementById('sync-actions-wrap'); if (nd) out.push(nd);
  nd = document.querySelector('.hdr-demo-btn'); if (nd) out.push(nd);
  nd = document.getElementById('ops-theme-tog'); if (nd) out.push(nd);
  nd = document.querySelector('button.hdr-icon-btn[onclick="signOut()"]'); if (nd) out.push(nd);
  return out;
}
function grabHomes(controls){
  try { var tb = document.getElementById('tb-actions'); if (tb && !TB_HOME) TB_HOME = { node: tb, parent: tb.parentNode, next: tb.nextSibling }; } catch(e){}
  for (var i=0;i<controls.length;i++){
    var nd = controls[i], known = false;
    for (var j=0;j<CTRL_HOME.length;j++){ if (CTRL_HOME[j].node === nd){ known = true; break; } }
    if (!known && nd.closest('.app-header')) CTRL_HOME.push({ node: nd, parent: nd.parentNode, next: nd.nextSibling });
  }
  for (var k=CTRL_HOME.length-1;k>=0;k--){ if (!CTRL_HOME[k].node.isConnected) CTRL_HOME.splice(k,1); }
}
function placeActions(){
  try {
    var tb = document.getElementById('tb-actions'), rail = document.getElementById('action-rail');
    if (!tb || !rail) return;
    var controls = railControls();
    grabHomes(controls);
    var shell = document.getElementById('app-shell');
    var signedIn = !(shell && shell.style.display === 'none');
    if (PORT_MQ.matches || !signedIn){
      if (TB_HOME && TB_HOME.parent && TB_HOME.parent.isConnected && tb.parentNode === rail)
        (TB_HOME.next && TB_HOME.next.parentNode === TB_HOME.parent) ? TB_HOME.parent.insertBefore(tb, TB_HOME.next) : TB_HOME.parent.appendChild(tb);
      for (var i=0;i<CTRL_HOME.length;i++){
        var h0 = CTRL_HOME[i];
        try {
          if (h0.parent && h0.parent.isConnected && h0.node.parentNode !== h0.parent)
            (h0.next && h0.next.parentNode === h0.parent) ? h0.parent.insertBefore(h0.node, h0.next) : h0.parent.appendChild(h0.node);
        } catch(e){}
      }
      rail.style.display = 'none';
    } else {
      if (tb.parentElement !== rail) rail.appendChild(tb);
      for (var j=0;j<controls.length;j++){ if (controls[j].parentNode !== rail) rail.appendChild(controls[j]); }
      rail.style.display = 'flex';
    }
  } catch(e){}
}
(function(){
  var _pst = window.setTopbar;
  if (typeof _pst === 'function'){
    window.setTopbar = function(){ var o = _pst.apply(this, arguments); try { placeActions(); } catch(e){} return o; };
  }
  document.addEventListener('DOMContentLoaded', function(){ try { placeActions(); renderDemoBanner_(); } catch(e){} });
  try { placeActions(); } catch(e){}
  if (PORT_MQ.addEventListener) PORT_MQ.addEventListener('change', function(){ try { placeActions(); } catch(e){} });
  try {
    var sh = document.getElementById('app-shell');
    if (sh && window.MutationObserver) new MutationObserver(function(){ try { placeActions(); } catch(e){} }).observe(sh, { attributes:true, attributeFilter:['style'] });
  } catch(e){}
})();

/* /t/{slug} for a real (Supabase) org is branding/paused-screen only at
   boot — actual tournament data loads post-auth via org_members lookup
   (completeSupabaseLogin_), regardless of which URL got them there, so a
   signed-in user only ever sees orgs they actually belong to. Slugs that
   aren't a real org fall through to the existing local demo-tenant path
   unchanged. */
function bootDemoTenantPath_(slug){
  var tenant_ = findTenant(slug);
  if (tenant_) {
    if (tenant_.status === 'suspended') { showTenantPausedScreen_(tenant_); }
    else if (!S._demoOrg || S._demoOrg !== slug) { enterDemoOrg(tenant_); renderDemoBanner_(); try { renderNav(); } catch(e){} }
  }
}
/* boot — /t/{slug} enters a demo tenant; any other path restores your real state */
(function(){
  try {
    /* Second segment (m[2]) is the optional per-tournament slug for an
       organizer running more than one at once — /t/{org-slug}/{tournament-slug}. */
    var m = location.pathname.match(/^\/t\/([a-z0-9-]+)(?:\/([a-z0-9-]+))?/i);
    if (m) {
      var slug = m[1].toLowerCase();
      var tSlug = m[2] ? m[2].toLowerCase() : null;
      if (sb) {
        sb.from('organizations').select('*').eq('slug', slug).maybeSingle().then(function(res){
          if (res.data) {
            if (res.data.status === 'suspended') { showTenantPausedScreen_(res.data); return; }
            PENDING_TENANT_SLUG = tSlug;
            if (tSlug) {
              sb.from('tournaments').select('name').eq('org_id', res.data.id).eq('slug', tSlug).maybeSingle().then(function(tRes){
                var trnName = tRes.data ? tRes.data.name : res.data.name;
                try { var snR = el('sb-trn-name'); if (snR) snR.textContent = trnName; } catch(e){}
                setTenantSigninSubtitle_(trnName);
              });
            } else {
              try { var snR2 = el('sb-trn-name'); if (snR2) snR2.textContent = res.data.name; } catch(e){}
              setTenantSigninSubtitle_(res.data.name);
            }
          } else {
            bootDemoTenantPath_(slug);
          }
        }).catch(function(){ bootDemoTenantPath_(slug); });
      } else {
        bootDemoTenantPath_(slug);
      }
    } else {
      leaveDemoOrgIfNeeded();
    }
  } catch(e){}
  try { if (typeof AUTH !== 'undefined' && AUTH && AUTH.signedIn && ['teams','groups','bracket'].indexOf(S.page) !== -1) render(); } catch(e){}
  try { var sn = el('sb-trn-name'); if (sn && S._tournamentMeta && S._tournamentMeta.name) sn.textContent = S._tournamentMeta.name; } catch(e){}
  renderDemoBanner_();
  try { renderNav(); } catch(e){}
  try { placeActions(); } catch(e){}
})();
</script>
