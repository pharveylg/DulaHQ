<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dula HQ — Tournament Manager</title>
<meta name="description" content="Dula HQ is a tournament management platform for running brackets, groups, live scoring, referee tools, and team registration — all in one place.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://www.dulahq.com/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Dula HQ">
<meta property="og:title" content="Dula HQ — Tournament Manager">
<meta property="og:description" content="Run brackets, groups, live scoring, referee tools, and team registration — all in one place.">
<meta property="og:url" content="https://www.dulahq.com/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Dula HQ — Tournament Manager">
<meta name="twitter:description" content="Run brackets, groups, live scoring, referee tools, and team registration — all in one place.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<!-- Not deferred, unlike the export libs below: auth/tenant resolution needs
     this available before the main boot script runs (it's a classic inline
     script, not a module, so it executes synchronously during parsing —
     a deferred script here would still be loading when it does). -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:focus-visible{outline:2px solid var(--navacc);outline-offset:2px}
.skip-link{position:fixed;top:-100px;left:8px;z-index:9999;background:var(--n2);color:var(--text);border:1px solid var(--nb);border-radius:8px;padding:10px 16px;font-size:var(--fs14);text-decoration:none;transition:top .15s ease-out}
.skip-link:focus{top:8px}
:root{
  /* "Sporty" palette (light = default theme) — ported from the reference
     template, with --gold/--navacc/--green/--amber darkened from the
     template's literal values (#0284C7/#16A34A/#16A34A/#D97706, which
     measured 4.10:1 / 3.30:1 / 3.30:1 / 3.19:1 on white) since all four are
     used as real text/badge/active-nav-item color, not just decoration.
     Tint backgrounds (--gl/--gb/--grbg/--grb/--ambg/--amb) keep the
     template's original values — those are translucent fills, not text. */
  --navy:#F8FAFC;--n2:#FFFFFF;--n3:#F1F5F9;--n4:#E2E8F0;
  --nb:#E2E8F0;--nbl:#F8FAFC;
  --gold:#0369A1;--gl:rgba(2,132,199,.12);--gb:rgba(2,132,199,.35);
  --text:#0F172A;--ts:#334155;--tm:#64748B;
  --navacc:#15803D;--navaccl:rgba(22,163,74,.12);--navaccb:rgba(22,163,74,.35);
  --green:#15803D;--grbg:rgba(22,163,74,.10);--grb:rgba(22,163,74,.3);
  --red:#DC2626;--rdbg:rgba(220,38,38,.10);--rdb:rgba(220,38,38,.3);
  --amber:#a35a06;--ambg:rgba(217,119,6,.10);--amb:rgba(217,119,6,.3);
  --blue:#2563eb;--blbg:rgba(37,99,235,.08);--blb:rgba(37,99,235,.25);
  --purple:#7c3aed;--purbg:rgba(124,58,237,.08);--purb:rgba(124,58,237,.25);
  --shadow:0 4px 15px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.03);
  /* text color for content sitting ON TOP of --navacc (e.g. .btn.primary):
     needs its own token because --navacc itself flips from a dark green
     (light theme, wants white text) to a bright neon green (dark theme,
     wants dark text) — a fixed color would fail one theme or the other. */
  --on-accent:#fff;
  --r:8px;--sb:220px;--sbr:230px;
  --font-body:'Inter',system-ui,sans-serif;--font-heading:'Oswald',sans-serif;
  --fs11:11px;--fs12:12px;--fs13:13px;--fs14:14px;--fs15:15px;--fs16:16px;--fs18:18px;--fs20:20px;--fs22:22px;--fs24:24px;--fs26:26px;--fs29:29px;--fs34:34px;--fs38:38px;--fs41:41px;--fs44:44px;--fs46:46px;--fs48:48px;--fs52:52px;--fs53:53px;--fs58:58px;
  color-scheme:light;
}
body{font-family:var(--font-body);background:var(--n3);color:var(--text);font-size:var(--fs16);line-height:1.5;min-height:100vh;overflow-x:hidden}
h1,h2,h3,.app-header-name,.tb-title,.card-title,.sec-label{font-family:var(--font-heading);letter-spacing:.02em}
.shell{display:flex;flex-direction:column;min-height:100vh}
.main{flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{padding:16px 20px;border-bottom:1px solid var(--nb);display:flex;align-items:center;justify-content:space-between;background:var(--n2);position:sticky;top:0;z-index:50}
.topbar::after{content:'';position:absolute;bottom:-1px;left:0;width:15%;height:2px;background:var(--navacc)}
.content{flex:1;padding:20px;max-width:1300px}
.app-header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--n2);border-bottom:1px solid var(--nb);position:sticky;top:0;z-index:100;flex-wrap:wrap}
.app-header-brand{display:flex;flex-direction:column;margin-right:4px}
.app-header-name{font-size:var(--fs16);font-weight:700;line-height:1.1}
.app-header-sub{font-size:var(--fs12);color:var(--tm);margin-top:1px}
.hdr-dropdown-wrap{position:relative}
.hdr-dropdown-btn{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:var(--r);border:1px solid var(--nb);background:var(--n3);color:var(--text);font-size:var(--fs14);font-weight:500;cursor:pointer;font-family:inherit}
.hdr-dropdown-btn:hover{background:var(--n4)}
.hdr-dropdown-panel{position:absolute;top:calc(100% + 6px);left:0;background:var(--n2);border:1px solid var(--nb);border-radius:var(--r);padding:8px;min-width:220px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:101;display:flex;flex-direction:column;gap:2px}
.hdr-dropdown-panel-wide{min-width:240px;max-height:70vh;overflow-y:auto}
.dropdown-group-label{font-size:var(--fs11);text-transform:uppercase;letter-spacing:.06em;color:var(--tm);font-weight:600;padding:6px 10px 2px}
.hdr-demo-btn{background:var(--navaccl);border:1px solid var(--navaccb);color:var(--navacc);padding:7px 12px;border-radius:0;font-size:var(--fs13);font-weight:700;text-transform:uppercase;letter-spacing:.03em;cursor:pointer;font-family:var(--font-heading);display:flex;align-items:center;gap:5px;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);transition:background .15s,color .15s}
.hdr-demo-btn:hover{background:var(--navacc);color:var(--on-accent)}
.app-header-user{display:flex;align-items:center;gap:8px;margin-left:auto}
.hdr-icon-btn{background:transparent;border:1px solid var(--nb);color:var(--tm);width:32px;height:32px;border-radius:var(--r);cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
.hdr-icon-btn:hover{color:var(--red);border-color:var(--rdb)}
.category-strip{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;background:var(--navy);border-bottom:1px solid var(--nbl)}
.cat-pill{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:6px 16px;border-radius:0;border:1px solid var(--nb);background:var(--n2);color:var(--ts);font-size:var(--fs13);font-weight:600;cursor:pointer;font-family:var(--font-heading);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);transition:background .15s}
.cat-pill:hover{background:var(--n3)}
.cat-pill.active{background:var(--navaccl);color:var(--navacc);border-color:var(--navaccb);font-weight:600}
.cat-pill-add{width:32px;padding:6px;justify-content:center;clip-path:none;border-radius:6px}
.role-pill{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--r);font-size:var(--fs14);cursor:pointer;color:var(--ts);border:none;background:transparent;width:100%;text-align:left;transition:all .15s;font-family:inherit;margin-bottom:2px}
.role-pill:hover{background:var(--n3);color:var(--text)}
.role-pill.active{background:var(--navaccl);color:var(--navacc);border:1px solid var(--navaccb);font-weight:500}
.role-pill i{font-size:var(--fs16);width:16px}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:0;border-left:3px solid transparent;font-size:var(--fs15);cursor:pointer;color:var(--ts);border-top:none;border-right:none;border-bottom:none;background:transparent;width:100%;text-align:left;transition:all .15s;font-family:inherit;margin-bottom:2px}
.nav-item:hover{background:var(--n3);color:var(--text)}
.nav-item.active{background:var(--navaccl);color:var(--navacc);font-weight:600;border-left-color:var(--navacc);border-radius:0 8px 8px 0}
.nav-item.active i{color:var(--navacc)}
.nav-item i{font-size:var(--fs18);width:17px}
.nav-badge{margin-left:auto;background:var(--gl);color:var(--gold);font-size:var(--fs12);padding:1px 6px;border-radius:10px;border:1px solid var(--gb);font-weight:500}
.nav-badge.live-badge{background:var(--rdbg);color:var(--red);border-color:var(--rdb);animation:pulse 1.5s infinite}
.mob-tab .nav-badge{position:absolute;top:0;right:6px;margin-left:0}
.manual-chip{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:20px;border:1px solid var(--nb);background:var(--n3);font-size:var(--fs14);font-weight:500;cursor:grab;user-select:none}
.manual-chip:active{cursor:grabbing}
.manual-chip.selected{border-color:var(--navacc);background:var(--navaccl);color:var(--navacc)}
.manual-chip i{font-size:var(--fs14);color:var(--tm)}
.manual-dropzone{min-height:60px;cursor:pointer;transition:background .1s,border-color .1s}
.manual-dropzone:hover{border-color:var(--navaccb)}
.manual-slot{flex:1;display:flex;align-items:center;justify-content:center;border:1px dashed var(--nb);border-radius:var(--r);padding:8px 10px}
.manual-slot-filled{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border-radius:6px;background:var(--n3);margin-bottom:4px;font-size:var(--fs14)}
.manual-slot-filled button,.manual-slot button{background:transparent;border:none;color:var(--tm);cursor:pointer;padding:2px;display:flex}
.manual-slot-filled button:hover,.manual-slot button:hover{color:var(--red)}
.manual-placeholder{font-size:var(--fs12);color:var(--tm);padding:8px 0}
.trn-name{font-size:var(--fs14);font-weight:600;color:var(--navacc)}
.trn-meta{font-size:var(--fs13);color:var(--tm);margin-top:3px}
/* .sec-label had no dedicated rule before — every usage relied on inline
   style="margin-bottom:8px" alone, so section labels ("View as",
   "Category", "Manage") rendered as plain unstyled text. */
.sec-label{font-size:var(--fs13);color:var(--tm);font-weight:700;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.sec-label::after{content:'';flex:1;height:1px;background:var(--nb)}
/* Left accent bar via border (not ::before + overflow:hidden, like the
   reference template) — .card wraps wide tables that need overflow-x:auto
   to scroll horizontally on desktop; hiding overflow would clip them. */
.card{background:var(--n2);border:1px solid var(--nb);border-left:3px solid var(--nb);border-radius:8px;padding:20px;margin-bottom:16px;overflow-x:auto;box-shadow:var(--shadow);transition:border-left-color .2s}
.card:hover{border-left-color:var(--navacc)}
.card-title{font-size:var(--fs18);font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--text);display:flex;align-items:center;gap:8px;margin-bottom:16px}
.card-title i{color:var(--gold);font-size:var(--fs18)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat-tile{background:var(--n3);border:1px solid var(--nb);border-radius:var(--r);padding:14px 16px}
.stat-n{font-size:var(--fs29);font-weight:600;line-height:1.1}
.stat-n.gd{color:var(--gold)}
.stat-l{font-size:var(--fs13);color:var(--tm);margin-top:4px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.field{margin-bottom:10px}
.field label{display:block;font-size:var(--fs13);color:var(--ts);margin-bottom:5px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;background:var(--n3);border:1px solid var(--nb);border-radius:var(--r);color:var(--text);font-size:var(--fs15);font-family:inherit}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold)}
.field select option{background:var(--n3)}
.btn{padding:8px 16px;border-radius:0;border:1px solid var(--nb);background:var(--n2);color:var(--ts);font-size:var(--fs14);cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:var(--font-heading);font-weight:600;text-transform:uppercase;letter-spacing:.03em;transition:transform .15s,background .15s,box-shadow .15s;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.btn:hover{color:var(--text);background:var(--n3);transform:translateY(-1px)}
.btn.primary{background:var(--navacc);color:var(--on-accent);border-color:var(--navacc);font-weight:600;box-shadow:0 4px 10px var(--navaccb)}
.btn.primary:hover{box-shadow:0 4px 15px var(--navaccb);transform:translateY(-1px)}
.btn.danger{background:var(--rdbg);color:var(--red);border-color:var(--rdb)}
.btn.sm{padding:4px 10px;font-size:var(--fs13)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:2px;font-size:var(--fs12);font-weight:700;white-space:nowrap;font-family:var(--font-heading);text-transform:uppercase;letter-spacing:.03em}
.bg{background:var(--gl);color:var(--gold);border:1px solid var(--gb)}
.bgr{background:var(--grbg);color:var(--green);border:1px solid var(--grb)}
.brd{background:var(--rdbg);color:var(--red);border:1px solid var(--rdb)}
.bamb{background:var(--ambg);color:var(--amber);border:1px solid var(--amb)}
.bbl{background:var(--blbg);color:var(--blue);border:1px solid var(--blb)}
.bgy{background:var(--n3);color:var(--ts);border:1px solid var(--nb)}
.bpur{background:var(--purbg);color:var(--purple);border:1px solid var(--purb)}
.trow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--nbl)}
.trow:last-child{border-bottom:none}
.tgl-label{font-size:var(--fs15);font-weight:500}
.tgl-sub{font-size:var(--fs13);color:var(--tm);margin-top:2px}
.tgl{width:38px;height:21px;background:var(--nb);border-radius:11px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.tgl.on{background:var(--gold)}
.tgl::after{content:'';position:absolute;width:15px;height:15px;background:#fff;border-radius:50%;top:3px;left:3px;transition:left .2s}
.tgl.on::after{left:20px}
.empty{text-align:center;padding:40px 20px;color:var(--tm)}
.empty i{font-size:var(--fs38);display:block;margin-bottom:10px;opacity:.5}
.empty p{font-size:var(--fs15)}
.alert{padding:10px 12px;border-radius:var(--r);font-size:var(--fs14);display:flex;gap:8px;align-items:flex-start;line-height:1.5;margin-bottom:10px}
.alert-info{background:var(--gl);color:var(--gold);border:1px solid var(--gb)}
.alert-warn{background:var(--ambg);color:var(--amber);border:1px solid var(--amb)}
.alert-err{background:var(--rdbg);color:var(--red);border:1px solid var(--rdb)}
.tb-title{font-size:var(--fs18);font-weight:600}
.tb-sub{font-size:var(--fs14);color:var(--ts);margin-top:2px}
.tb-actions{display:flex;gap:8px;align-items:center}
.tbl{width:100%;border-collapse:separate;border-spacing:0 4px;font-size:var(--fs14)}
.tbl th{text-align:left;padding:8px 12px;color:var(--tm);font-weight:600;font-size:var(--fs12);text-transform:uppercase;letter-spacing:.05em}
.tbl td{padding:10px 12px;background:var(--n2);border-top:1px solid var(--nb);border-bottom:1px solid var(--nb);vertical-align:middle}
.tbl td:first-child{border-left:1px solid var(--nb);border-radius:4px 0 0 4px}
.tbl td:last-child{border-right:1px solid var(--nb);border-radius:0 4px 4px 0}
.tbl tr:last-child td{border-bottom:none}
.tbl td.num,.tbl th.num{text-align:center}
.p-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--nbl)}
.org-tier{display:flex;justify-content:center;flex-wrap:wrap;gap:14px;position:relative}
.org-connector{width:2px;height:22px;background:var(--nb);margin:0 auto}
.org-node{background:var(--n3);border:1px solid var(--nb);border-radius:10px;padding:12px 16px;min-width:140px;max-width:180px;text-align:center}
.org-tier-label{text-align:center;font-size:var(--fs12);color:var(--tm);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.team-link{cursor:pointer}
.team-link:hover{text-decoration:underline;color:var(--gold)}
.p-row:last-child{border-bottom:none}
.ava{width:32px;height:32px;border-radius:50%;background:var(--gl);display:flex;align-items:center;justify-content:center;font-size:var(--fs13);font-weight:600;color:var(--gold);flex-shrink:0;border:1px solid var(--gb)}
.p-info{flex:1;min-width:0}
.p-name{font-size:var(--fs15);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-sub{font-size:var(--fs13);color:var(--tm)}
.mc{background:var(--n2);border:1px solid var(--nb);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.mc-hd{padding:8px 14px;background:var(--n3);border-bottom:1px solid var(--nbl);display:flex;align-items:center;justify-content:space-between}
.mc-teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:12px 14px}
.mc-team{font-size:var(--fs15);font-weight:600}
.mc-team.r{text-align:right}
.mc-score{background:var(--n3);border:1px solid var(--nb);border-radius:6px;padding:5px 14px;text-align:center;font-size:var(--fs22);font-weight:700;color:var(--gold);min-width:76px}
.expand-btn{width:100%;padding:7px;background:transparent;border:none;border-top:1px solid var(--nbl);color:var(--tm);font-size:var(--fs13);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;font-family:inherit;font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.mc-expand{display:none;padding:10px 14px 12px}
.mc-expand.open{display:block}
.ev-row{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:var(--fs14);color:var(--ts)}
.ev-min{color:var(--gold);font-weight:600;min-width:26px;text-align:right;font-size:var(--fs13)}
.ev-i i{font-size:var(--fs15)}
.ev-goal i{color:var(--gold)}
.ev-yel i{color:var(--amber)}
.ev-red i{color:var(--red)}
.ev-sub i{color:var(--blue)}
.ev-pen i{color:var(--purple)}
.fmt-opt{padding:12px;border-radius:var(--r);text-align:center;cursor:pointer;border:1px solid var(--nb);background:var(--n3)}
.fmt-opt.sel{background:var(--gl);border-color:var(--gb)}
.fmt-label{font-size:var(--fs15);font-weight:600;color:var(--ts);margin-top:6px}
.fmt-opt.sel .fmt-label{color:var(--gold)}
.fmt-sub{font-size:var(--fs13);color:var(--tm);margin-top:2px}
.struct-opt{padding:10px 12px;border-radius:var(--r);cursor:pointer;border:1px solid var(--nb);background:var(--n3);text-align:left}
.struct-opt.sel{background:var(--gl);border-color:var(--gb)}
.tb-list-panel{display:none;padding-top:8px}
.tb-list-panel.open{display:block}
.tb-item{display:flex;gap:8px;padding:7px 10px;border-radius:var(--r);margin-bottom:4px;background:var(--n3);border:1px solid var(--nbl);align-items:flex-start}
.tb-rank{width:18px;height:18px;border-radius:50%;background:var(--gl);border:1px solid var(--gb);color:var(--gold);font-size:var(--fs12);font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.ref-board{background:var(--n3);border:1px solid var(--nb);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-bottom:12px}
.ref-tname{font-size:var(--fs15);font-weight:600;text-align:center}
.ref-trole{font-size:var(--fs12);color:var(--tm);text-align:center;margin-top:2px;text-transform:uppercase;letter-spacing:.05em}
.ref-score{font-size:var(--fs38);font-weight:700;color:var(--gold);text-align:center}
.timer-n{font-size:var(--fs34);font-weight:700;color:var(--gold);text-align:center;padding:4px 0}
.timer-s{font-size:var(--fs13);color:var(--tm);text-align:center;margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em}

/* Mobile breakpoint — single source of truth. Matches MOBILE_MAX in the
   script below; change both together if this ever needs to move. Widened
   from the original 768px to 1024px so tablets/narrow laptop windows get
   the purpose-built mobile nav and layouts too, not a squeezed desktop. */
@media(max-width:1024px){
  :root{--fs11:10px;--fs12:11px;--fs13:12px;--fs14:12px;--fs15:13px;--fs16:14px;--fs18:15px;--fs20:17px;--fs22:18px;--fs24:20px;--fs26:21px;--fs29:24px;--fs34:27px;--fs38:30px;--fs41:32px;--fs44:35px;--fs46:36px;--fs48:38px;--fs52:41px;--fs53:42px;--fs58:46px;}
  .mob-nav{display:block}
  .content{padding:14px;padding-bottom:80px}

  .g3{grid-template-columns:1fr}
  .g2{grid-template-columns:1fr}
  /* Tables → labeled-row cards instead of a shrunk/scrolling table.
     data-th is stamped by enhanceTablesForMobile() after every render. */
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr{display:block;width:100%}
  .tbl tr{border:1px solid var(--nb);border-radius:10px;padding:4px 10px;margin-bottom:8px;background:var(--n2)}

  .modal-overlay{align-items:flex-end;padding:0}

/* Convert any <i class="ti ti-xxx"></i> markup already in template strings

function hydrateIcons(root) {
  var nodes = root.querySelectorAll('i.ti');
  for (var i = 0; i < nodes.length; i++) {
    var node = nodes[i];
    var cls = node.className || '';
    var m = cls.match(/ti-([a-z0-9-]+)/);
    if (!m) continue;
    var name = m[1];
    var computed = (typeof window !== 'undefined' && window.getComputedStyle) ? window.getComputedStyle(node) : null;

    var size = sizeMatch ? parseInt(sizeMatch[1]) : (computed ? (parseInt(computed.fontSize) || 16) : 16);
    var colorMatch = (node.getAttribute('style') || '').match(/color:\s*([^;]+)/);
    // Some icons (e.g. sidebar nav items, active-state icons) only get their
    // color from a CSS class rule like ".nav-item.active i{color:gold}" —
    // not an inline style. Fall back to the resolved computed color so
    // that class-driven highlighting survives the swap to <svg>.
    var color = colorMatch ? colorMatch[1] : (computed ? computed.color : null);
    var wrap = document.createElement('span');
    wrap.innerHTML = svgIcon(name, size, color);

    lines.push(csvEscape('Generated: ' + meta.generatedAt + ' by ' + meta.generatedBy));
    if (meta.filters) lines.push(csvEscape('Filters: ' + meta.filters));
    lines.push('');
  }
  lines.push(headers.map(csvEscape).join(','));
  for (var i = 0; i < rows.length; i++) { lines.push(rows[i].map(csvEscape).join(',')); }
  var blob = new Blob([lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  downloadBlob(blob, filename + '.csv');
  logAudit('Report exported', meta.title + ' \u2014 CSV', null);
  showToast('CSV downloaded');
}
function exportToExcel(filename, headers, rows, meta) {
  if (typeof XLSX === 'undefined') { showToast('Excel export library did not load \u2014 check your connection'); return; }
  var wsData = [];
  if (meta) {
    wsData.push([meta.tournament]);
    wsData.push([meta.title]);
    wsData.push(['Generated: ' + meta.generatedAt + ' by ' + meta.generatedBy]);
    if (meta.filters) wsData.push(['Filters: ' + meta.filters]);
    wsData.push([]);
  }
  wsData.push(headers);
  for (var i = 0; i < rows.length; i++) { wsData.push(rows[i]); }
  var ws = XLSX.utils.aoa_to_sheet(wsData);
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Report');
  XLSX.writeFile(wb, filename + '.xlsx');
  logAudit('Report exported', meta.title + ' \u2014 Excel', null);
  showToast('Excel file downloaded');
}
function exportToPDF(filename, headers, rows, meta) {
  if (typeof window.jspdf === 'undefined') { showToast('PDF export library did not load \u2014 check your connection'); return; }
  var doc = new window.jspdf.jsPDF();
  var y = 14;
  doc.setFontSize(14); doc.text(meta.tournament, 14, y); y += 7;
  doc.setFontSize(11); doc.text(meta.title, 14, y); y += 6;
  doc.setFontSize(9); doc.setTextColor(120);

    head: [headers],

}

function buildStandingsExportData() {
  var cat = activeCategory();
  var all = [];
  for (var gi = 0; gi < S.groups.length; gi++) {
    var grp = S.groups[gi];
    var standings = calcGroupStandings(gi);
    for (var idx = 0; idx < standings.length; idx++) {
      var s = standings[idx];
      var copy = {}; for (var key in s) copy[key] = s[key];
      copy.grpName = grp.name;
      all.push(copy);
    }
  }
  all.sort(function (a, b) { if (b.pts !== a.pts) return b.pts - a.pts; return (b.gf - b.ga) - (a.gf - a.ga); });
  var headers = ['#', 'Team', 'Group', 'MP', 'Pts', 'GD', 'GF'];
  var rows = [];
  for (var i = 0; i < all.length; i++) {
    var s2 = all[i];
    var tm = getTeamById(s2.id);
    rows.push([i + 1, tm ? tm.name : '?', s2.grpName, s2.mp, s2.pts, s2.gf - s2.ga, s2.gf]);
  }
  return { headers: headers, rows: rows, meta: buildExportMeta('Standings', cat.name) };
}
function buildScheduleExportData() {
  var cat = activeCategory();
  var headers = ['Group', 'Home', 'Away', 'Score', 'Status', 'Pitch', 'Kick-off'];
  var rows = [];
  for (var mi = 0; mi < S.groupMatches.length; mi++) {
    var m = S.groupMatches[mi];
    var grp = S.groups[m.group];
    var ht = getTeamById(m.homeId), at = getTeamById(m.awayId);
    rows.push([
      grp ? grp.name : '', ht ? ht.name : '?', at ? at.name : '?',
      m.played ? (m.homeScore + '\u2013' + m.awayScore) : '\u2013',
      m.inProgress ? 'Live' : (m.played ? (m.verified ? 'Full time (verified)' : 'Full time (pending)') : 'Scheduled'),
      m.pitchName || '', m.kickoff || ''
    ]);
  }
  return { headers: headers, rows: rows, meta: buildExportMeta('Match schedule', cat.name) };
}
function buildOfficialsExportData() {
  var cat = activeCategory();
  var headers = ['Pitch', 'Group', 'Home', 'Score', 'Away', 'Referee', 'Status'];
  var rows = [];
  for (var mi = 0; mi < S.groupMatches.length; mi++) {
    var m = S.groupMatches[mi];

    ]);

function buildTeamDashExportData() {
  var tm = getTeamById(S.activeTeamId);
  if (!tm) return null;
  var stats = computeTeamStats(tm);
  var headers = ['Result', 'Opponent', 'Score', 'Verified'];
  var rows = [];
  for (var i = 0; i < stats.prev.length; i++) {
    var m = stats.prev[i];
    var oppId = m.homeId === tm.id ? m.awayId : m.homeId;
    var opp = getTeamById(oppId);
    var my = m.homeId === tm.id ? m.homeScore : m.awayScore;
    var their = m.homeId === tm.id ? m.awayScore : m.homeScore;
    var res = my > their ? 'W' : (my === their ? 'D' : 'L');
    rows.push([res, opp ? opp.name : '?', my + '\u2013' + their, m.verified ? 'Yes' : 'Pending']);
  }
  var meta = buildExportMeta('Team dashboard \u2014 ' + tm.name, activeCategory().name + ' \u00b7 Standings: ' + stats.rankLabel + ' \u00b7 Goals ' + stats.goals + ', Yellow ' + stats.yellow + ', Red ' + stats.red);

function buildTeamProfileExportData() {
  var tm = getTeamById(S.viewingTeamId);

  var headers = ['Result', 'Opponent', 'Score', 'Verified'];
  var rows = [];
  for (var i = 0; i < stats.prev.length; i++) {
    var m = stats.prev[i];
    var oppId = m.homeId === tm.id ? m.awayId : m.homeId;
    var opp = getTeamById(oppId);
    var my = m.homeId === tm.id ? m.homeScore : m.awayScore;
    var their = m.homeId === tm.id ? m.awayScore : m.homeScore;
    var res = my > their ? 'W' : (my === their ? 'D' : 'L');
    rows.push([res, opp ? opp.name : '?', my + '\u2013' + their, m.verified ? 'Yes' : 'Pending']);
  }
  var meta = buildExportMeta('Team profile \u2014 ' + tm.name, activeCategory().name + ' \u00b7 Standings: ' + stats.rankLabel);
  return { headers: headers, rows: rows, meta: meta };
}
function doExport(reportKey, format) {
  var data = null;
  if (reportKey === 'standings') data = buildStandingsExportData();
  else if (reportKey === 'schedule') data = buildScheduleExportData();
  else if (reportKey === 'officials') data = buildOfficialsExportData();
  else if (reportKey === 'teamdash') data = buildTeamDashExportData();
  else if (reportKey === 'teamprofile') data = buildTeamProfileExportData();
  if (!data) { showToast('Nothing to export yet'); return; }
  var filename = (data.meta.title || reportKey).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
  if (format === 'csv') exportToCSV(filename, data.headers, data.rows, data.meta);
  else if (format === 'xlsx') exportToExcel(filename, data.headers, data.rows, data.meta);
  else if (format === 'pdf') exportToPDF(filename, data.headers, data.rows, data.meta);
}

/* Shared by every .tbl regardless of which render*() built it: stamps each
   cell with its column header as data-th, so the mobile stylesheet can turn
   rows into labeled cards (thead hidden, td::before shows data-th) without
   touching any of the ~9 individual table-rendering call sites. Desktop
   ignores data-th entirely — the table renders normally there. */
function enhanceTablesForMobile() {
  var tables = document.querySelectorAll('.tbl');
  for (var i = 0; i < tables.length; i++) {
    var ths = tables[i].querySelectorAll('thead th');
    var headers = [];
    for (var h = 0; h < ths.length; h++) headers.push(ths[h].textContent);
    var rows = tables[i].querySelectorAll('tbody tr');
    for (var r = 0; r < rows.length; r++) {
      var cells = rows[r].children;
      for (var c = 0; c < cells.length; c++) {
        if (headers[c]) cells[c].setAttribute('data-th', headers[c]);
      }
    }
  }
}

function selFmt(f, elem) {
  S.tournament.format = f;
  var opts = document.querySelectorAll('.fmt-opt');
  for (var i = 0; i < opts.length; i++) {
    opts[i].classList.remove('sel');
    var ico = opts[i].querySelector('.ti-ball-football');
    if (ico) ico.style.color = 'var(--ts)';
    var subEl = opts[i].querySelector('.fmt-sub');
    var lbl = opts[i].querySelector('.fmt-label');
    if (subEl && lbl) {
      var txt = lbl.textContent;
      subEl.textContent = txt.indexOf('11') >= 0 ? 'Full match' : (txt.indexOf('8') >= 0 ? '8 outfield + GK' : '7 players');
    }
  }
  elem.classList.add('sel');
  var ico2 = elem.querySelector('.ti-ball-football');
  if (ico2) ico2.style.color = 'var(--gold)';
  elem.querySelector('.fmt-sub').textContent = 'Selected';
}

function selStructure(k, elem) {
  S.tournament.structure = k;
  var opts = document.querySelectorAll('.struct-opt');
  for (var i = 0; i < opts.length; i++) { opts[i].classList.remove('sel'); }
  elem.classList.add('sel');
  renderStructureDetail();
}

function renderStructureDetail() {
  var t = S.tournament;
  var k = t.structure || 'groups_knockout';
  var ed = el('struct-detail');
  if (!ed) return;
  var html = '';
  if (k === 'groups_knockout') {
    var go = '';
    var ng = [1, 2, 4, 8];
    for (var a = 0; a < ng.length; a++) { go += '<option value="' + ng[a] + '"' + ((t.numGroups || 2) === ng[a] ? ' selected' : '') + '>' + ng[a] + ' group' + (ng[a] > 1 ? 's' : '') + '</option>'; }
    var ao = '';
    var na = [1, 2, 3, 4];
    for (var b = 0; b < na.length; b++) { ao += '<option value="' + na[b] + '"' + ((t.advancePer || 2) === na[b] ? ' selected' : '') + '>' + na[b] + ' team' + (na[b] > 1 ? 's' : '') + '</option>'; }
    html = '<div class="g2"><div class="field"><label>Number of groups</label><select id="inp-ngroups">' + go + '</select></div>'
      + '<div class="field"><label>Teams advancing per group</label><select id="inp-advper">' + ao + '</select></div></div>'
      + '<div class="alert alert-info" style="margin-top:4px"><i class="ti ti-info-circle"></i><span>Group matches and knockout bracket generated automatically.</span></div>';
  } else if (k === 'knockout') {
    html = '<div class="g2"><div class="field"><label>Seeding</label><select id="inp-seed"><option value="random">Random draw</option><option value="manual">Manual seeding</option></select></div>'
      + '<div class="field"><label>3rd place play-off</label><select id="inp-3rd"><option value="no">No</option><option value="yes">Yes</option></select></div></div>'
      + '<div class="alert alert-info" style="margin-top:4px"><i class="ti ti-info-circle"></i><span>All teams enter the knockout bracket directly.</span></div>';
  } else if (k === 'round_robin' || k === 'double_round_robin') {
    html = '<div class="g2"><div class="field"><label>Points for a win</label><input type="number" id="inp-pts-win" value="' + (t.ptsWin || 3) + '" min="1" max="5" style="width:80px"></div>'
      + '<div class="field"><label>Points for a draw</label><input type="number" id="inp-pts-draw" value="' + (t.ptsDraw || 1) + '" min="0" max="3" style="width:80px"></div></div>'
      + '<div class="alert alert-info" style="margin-top:4px"><i class="ti ti-info-circle"></i><span>' + (k === 'round_robin' ? 'Each team plays every other team once.' : 'Each team plays every other team home and away.') + '</span></div>';
  } else if (k === 'custom') {
    html = '<div class="alert alert-warn"><i class="ti ti-alert-triangle"></i><span>Custom mode: go to Groups to manually add and score matches.</span></div>'
      + '<div style="margin-top:10px"><div class="field"><label>Label (optional)</label><input id="inp-custom-label" value="' + esc(t.customLabel || '') + '" placeholder="e.g. League Phase"></div></div>';
  }
  ed.innerHTML = html;
}

function toggleTb() {
  var li = el('tb-list');
  var ic = el('tb-icon');
  var open = li.classList.toggle('open');
  ic.className = open ? 'ti ti-chevron-up' : 'ti ti-chevron-down';
}
function addPitch() {
  if (!S.tournament.pitches) S.tournament.pitches = [];
  S.tournament.pitches.push({ name: 'Pitch ' + (S.tournament.pitches.length + 1) });
  renderSetup();
}
function removePitch(i) { S.tournament.pitches.splice(i, 1); renderSetup(); }
function updatePitchName(i, v) { if (S.tournament.pitches) S.tournament.pitches[i].name = v; }

function saveSetup() {
  var t = S.tournament;
  t.name = el('inp-name').value.trim() || 'Dula HQ Tournament';
  t.venue = el('inp-venue').value.trim();
  t.date = el('inp-date').value;
  t.ageCategory = el('inp-age').value;
  t.duration = parseInt(el('inp-dur').value) || 60;
  t.offside = el('tgl-offside').classList.contains('on');
  t.extraTime = el('tgl-et').classList.contains('on');
  t.penalties = el('tgl-pen').classList.contains('on');
  t.hasHalftime = el('tgl-half').classList.contains('on');
  t.guestAccessEnabled = el('tgl-guest').classList.contains('on');
  var k = t.structure || 'groups_knockout';
  if (k === 'groups_knockout') {
    var ngEl = el('inp-ngroups');
    var apEl = el('inp-advper');
    t.numGroups = ngEl ? (parseInt(ngEl.value) || 2) : 2;
    t.advancePer = apEl ? (parseInt(apEl.value) || 2) : 2;
  }
  if (k === 'round_robin' || k === 'double_round_robin') {
    var pwEl = el('inp-pts-win');
    var pdEl = el('inp-pts-draw');
    t.ptsWin = pwEl ? (parseInt(pwEl.value) || 3) : 3;
    t.ptsDraw = pdEl ? (parseInt(pdEl.value) || 1) : 1;
  }
  if (k === 'knockout') {
    var seedEl = el('inp-seed');
    var thirdEl = el('inp-3rd');
    t.seeding = seedEl ? seedEl.value : 'random';
    t.thirdPlace = thirdEl ? (thirdEl.value === 'yes') : false;
  }
  if (k === 'custom') {
    var clEl = el('inp-custom-label');
    t.customLabel = clEl ? clEl.value : '';
  }
  renderNav();
  render();
  showToast('Settings saved');
}

function kpiTile_(label, value, icon, color, onclick) {
  return '<div class="card" style="text-align:center;padding:14px 10px' + (onclick ? ';cursor:pointer' : '') + '"' + (onclick ? (' onclick="' + onclick + '"') : '') + '><i class="ti ' + icon + '" style="font-size:var(--fs24);color:' + (color || 'var(--gold)') + '"></i><div style="font-size:var(--fs26);font-weight:700;margin-top:6px' + (color ? (';color:' + color) : '') + '">' + value + '</div><div style="font-size:var(--fs13);color:var(--tm);margin-top:2px">' + esc(label) + '</div></div>';
}
function dashTile_(label, icon, onclick, badge) {
  return '<div class="card" style="text-align:center;padding:16px 10px;cursor:pointer;position:relative" onclick="' + onclick + '">'
    + (badge ? ('<span class="nav-badge" style="position:absolute;top:8px;right:8px">' + badge + '</span>') : '')
    + '<i class="ti ' + icon + '" style="font-size:var(--fs26);color:var(--gold)"></i>'
    + '<div style="font-size:var(--fs14);font-weight:600;margin-top:8px">' + esc(label) + '</div>'
    + '</div>';
}
function renderAdminDashboard() {
  setTopbar('Dashboard', 'Tournament overview');
  var totalTeams = 0, totalMatches = 0, liveMatches = 0;
  for (var i = 0; i < S.categories.length; i++) {
    var c = S.categories[i];
    totalTeams += c.teams.length;
    totalMatches += c.groupMatches.length;
    for (var j = 0; j < c.groupMatches.length; j++) { if (c.groupMatches[j].inProgress) liveMatches++; }
  }
  var pendingReg = 0; for (var r1 = 0; r1 < S.registrations.length; r1++) { if (S.registrations[r1].status === 'pending') pendingReg++; }
  var pendingAccess = 0; for (var r2 = 0; r2 < S.accessRequests.length; r2++) { if (S.accessRequests[r2].status === 'pending') pendingAccess++; }
  var allDocs = getAllDocumentUploads();
  var pendingDocs = 0; for (var r3 = 0; r3 < allDocs.length; r3++) { if (allDocs[r3].doc.status === 'pending') pendingDocs++; }
  var totalPending = pendingReg + pendingAccess + pendingDocs;
  // "Pending reviews" combines three separate queues \u2014 jump to whichever
  // actually has something waiting, rather than always landing on the same one
  var pendingTarget = pendingReg ? 'registrations' : (pendingAccess ? 'accessrequests' : (pendingDocs ? 'documentreviews' : 'registrations'));

  var html = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:22px">'
    + kpiTile_('Categories', S.categories.length, 'ti-layout-grid', null, "navTo('categories')")
    + kpiTile_('Teams', totalTeams, 'ti-users-group', null, "navTo('teams')")
    + kpiTile_('Live now', liveMatches, 'ti-player-play', liveMatches ? 'var(--red)' : null, "navTo('officials')")
    + kpiTile_('Pending reviews', totalPending, 'ti-alert-triangle', totalPending ? 'var(--amber)' : null, "navTo('" + pendingTarget + "')")
    + '</div>';

  html += '<div class="sec-label" style="margin-bottom:8px">View as</div>';
  html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:22px">'
    + dashTile_('Team Manager', 'ti-users', "switchRole('team')")
    + dashTile_('Referee', 'ti-whistle', "switchRole('referee')")
    + dashTile_('Tournament Committee', 'ti-shield-check', "switchRole('official')")
    + dashTile_('Guest', 'ti-trophy', "switchRole('audience')")
    + '</div>';

  html += '<div class="sec-label" style="margin-bottom:8px">Category</div>';
  html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:22px">'
    + dashTile_('Categories', 'ti-layout-grid', "navTo('categories')")
    + dashTile_('Groups & Draw', 'ti-grid-3x3', "navTo('groups')")
    + dashTile_('Bracket', 'ti-tournament', "navTo('bracket')")
    + dashTile_('Standings', 'ti-medal', "navTo('standings')")
    + '</div>';

  html += '<div class="sec-label" style="margin-bottom:8px">Manage</div>';
  html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px">'
    + dashTile_('Teams', 'ti-users-group', "navTo('teams')")
    + dashTile_('Users', 'ti-user', "navTo('users')")
    + dashTile_('Referees', 'ti-whistle', "navTo('referees')")
    + dashTile_('Officiating Team', 'ti-shield-check', "navTo('officiatingteam')")
    + dashTile_('Registrations', 'ti-user-plus', "navTo('registrations')", pendingReg)
    + dashTile_('Access Requests', 'ti-login', "navTo('accessrequests')", pendingAccess)
    + dashTile_('Document Reviews', 'ti-file-text', "navTo('documentreviews')", pendingDocs)
    + dashTile_('Audit Trail', 'ti-list', "navTo('audit')")
    + '</div>';

  el('main-content').innerHTML = html;
}

/* ---- Conflict prevention: same team / referee / pitch at the same kickoff time, tournament-wide ---- */
function findMatchConflicts(mid, proposed) {
  // proposed: { kickoff, pitchName, refereeId } — only checked fields that are non-empty
  var all = getAllScheduledMatches();
  var target = null;
  for (var i = 0; i < all.length; i++) { if (all[i].match.id === mid) { target = all[i]; break; } }
  if (!target) return [];
  var kickoff = (proposed && proposed.kickoff !== undefined) ? proposed.kickoff : target.match.kickoff;
  if (!kickoff) return []; // no kickoff time set yet — nothing to conflict on
  var pitchName = (proposed && proposed.pitchName !== undefined) ? proposed.pitchName : target.match.pitchName;
  var refereeId = (proposed && proposed.refereeId !== undefined) ? proposed.refereeId : target.match.refereeId;
  var conflicts = [];
  for (var j = 0; j < all.length; j++) {
    var other = all[j].match;
    if (other.id === mid) continue;
    if (other.played || !other.kickoff || other.kickoff !== kickoff) continue;
    if (other.homeId === target.match.homeId || other.homeId === target.match.awayId || other.awayId === target.match.homeId || other.awayId === target.match.awayId) {
      var oh = getTeamById(other.homeId), oa = getTeamById(other.awayId);
      conflicts.push('Team clash: a team in this match is already scheduled at ' + kickoff + ' (' + (oh ? oh.name : '?') + ' v ' + (oa ? oa.name : '?') + ')');
    }
    if (pitchName && other.pitchName === pitchName) {
      conflicts.push('Pitch clash: ' + pitchName + ' is already booked at ' + kickoff);
    }
    if (refereeId && other.refereeId === refereeId) {
      var refc = getRefereeById(refereeId);
      conflicts.push('Referee clash: ' + (refc ? refc.name : 'this referee') + ' is already assigned at ' + kickoff);
    }
  }
  return conflicts;
}
function assignReferee(mid, refId) {
  var conflicts = findMatchConflicts(mid, { refereeId: refId || null });
  if (refId && conflicts.length) {
    showToast(conflicts[0]);
    render();
    return;
  }
  for (var i = 0; i < S.groupMatches.length; i++) { if (S.groupMatches[i].id === mid) { S.groupMatches[i].refereeId = refId || null; break; } }
  var m = null;
  for (var j = 0; j < S.groupMatches.length; j++) { if (S.groupMatches[j].id === mid) { m = S.groupMatches[j]; break; } }
  var refr = refId ? getRefereeById(refId) : null;
  var ht = m ? getTeamById(m.homeId) : null, at = m ? getTeamById(m.awayId) : null;
  logAudit('Referee assigned', (refr ? refr.name : 'Unassigned') + ' \u2014 ' + (ht ? ht.name : '?') + ' v ' + (at ? at.name : '?'), mid);
  render();
}

/* ---- Self-assign: a referee claims one of their own unassigned matches ---- */
function claimMatch(mid) {
  if (!S.activeRefereeId) { showToast('Pick which referee you are first'); return; }
  var conflicts = findMatchConflicts(mid, { refereeId: S.activeRefereeId });
  if (conflicts.length) { showToast(conflicts[0]); return; }
  var m = null;
  for (var i = 0; i < S.groupMatches.length; i++) { if (S.groupMatches[i].id === mid) { m = S.groupMatches[i]; break; } }
  if (!m) return;
  if (m.refereeId) { showToast('Already claimed by another referee'); render(); return; }
  m.refereeId = S.activeRefereeId;
  var refr = getRefereeById(S.activeRefereeId);
  var ht = getTeamById(m.homeId), at = getTeamById(m.awayId);
  logAudit('Match self-assigned', (refr ? refr.name : '?') + ' claimed ' + (ht ? ht.name : '?') + ' v ' + (at ? at.name : '?'), mid);
  showToast('Match claimed');
  render();
}
function releaseMatch(mid) {
  var m = null;
  for (var i = 0; i < S.groupMatches.length; i++) { if (S.groupMatches[i].id === mid) { m = S.groupMatches[i]; break; } }
  if (!m) return;
  m.refereeId = null;
  logAudit('Match released', 'Referee released assignment', mid);
  render();
}
function setActiveReferee(id) { S.activeRefereeId = id || null; renderNav(); render(); }

/* ---------------- OFFICIATING TEAM (broader committee roster) ----------------
   The Referees page above handles referees specifically, wired into match
   assignment/self-assign/conflict-checking. This page is the wider Tournament
   Committee directory \u2014 referees plus every other designated role that
   supports officiating (assistant referees, fourth officials, commissioners,
   timekeepers, etc.) that don't need per-match assignment. Managed by Admin
   and the Tournament Committee (official) role. Tournament-wide, not scoped
   to a single category, since committee members typically serve across the
   whole event. */
var OFFICIATING_DESIGNATIONS = ['Referee', 'Assistant Referee', 'Fourth Official', 'Match Commissioner', 'Timekeeper', 'Video Assistant Referee (VAR)', 'Medical Officer', 'Security Officer', 'Other'];
/* Suggested hierarchy level per designation \u2014 1 is the top of the org
   chart (Match Commissioner). Editable per member, so a custom "Other"
   role (or any role) can be placed anywhere in the hierarchy. */
var DESIGNATION_DEFAULT_LEVEL = { 'Match Commissioner': 1, 'Referee': 2, 'Fourth Official': 2, 'Assistant Referee': 3, 'Video Assistant Referee (VAR)': 3, 'Timekeeper': 4, 'Medical Officer': 4, 'Security Officer': 4, 'Other': 5 };
function defaultLevelForDesignation(d) { return DESIGNATION_DEFAULT_LEVEL[d] || 5; }
function defaultOfficiatingMember() { return { id: 'com_' + uid(), name: '', phone: '', email: '', designation: 'Referee', designationOther: '', orgLevel: defaultLevelForDesignation('Referee'), notes: '', linkedRefereeId: null }; }
function getOfficiatingMemberById(id) {
  for (var i = 0; i < S.officiatingTeam.length; i++) { if (S.officiatingTeam[i].id === id) return S.officiatingTeam[i]; }
  return null;
}
function designationLabel(m) { return m.designation === 'Other' ? (m.designationOther || 'Other') : m.designation; }
function renderOfficiatingTeam() {
  var canManage = (S.role === 'admin' || S.role === 'official');
  setTopbar('Officiating Team', S.officiatingTeam.length + ' member' + (S.officiatingTeam.length === 1 ? '' : 's') + ' \u00b7 org chart', canManage ? ('<div style="display:flex;gap:6px;flex-wrap:wrap">'
    + '<button class="btn sm" onclick="downloadOfficiatingTemplate()"><i class="ti ti-download"></i> CSV template</button>'
    + '<input type="file" id="officiating-csv" accept=".csv,.xlsx,.xls" style="display:none" onchange="handleOfficiatingCsvUpload(this)">'
    + '<button class="btn sm" onclick="document.getElementById(\'officiating-csv\').click()"><i class="ti ti-upload"></i> Import CSV</button>'
    + '<button class="btn primary" onclick="openAddOfficiatingMember()"><i class="ti ti-plus"></i> Add member</button>'
    + '</div>') : '');
  if (!S.officiatingTeam.length) { el('main-content').innerHTML = '<div class="empty"><i class="ti ti-shield-check"></i><p>No officiating team members yet. Add referees, assistant referees, commissioners, timekeepers, and other designated roles here.</p></div>'; return; }
  var byLevel = {};
  var levels = [];
  for (var i = 0; i < S.officiatingTeam.length; i++) {
    var m = S.officiatingTeam[i];
    var lvl = m.orgLevel || defaultLevelForDesignation(m.designation);
    if (!byLevel[lvl]) { byLevel[lvl] = []; levels.push(lvl); }
    byLevel[lvl].push(m);
  }
  levels.sort(function (a, b) { return a - b; });
  var html = '<div class="card"><div class="card-title"><i class="ti ti-shield-check"></i> Officiating Team \u2014 Org Chart</div>';
  for (var li = 0; li < levels.length; li++) {
    var lvl2 = levels[li];
    var members = byLevel[lvl2];
    if (li > 0) html += '<div class="org-connector"></div>';
    html += '<div class="org-tier-label">Level ' + lvl2 + (lvl2 === 1 ? ' \u2014 Top' : '') + '</div><div class="org-tier">';
    for (var j = 0; j < members.length; j++) {
      var mm = members[j];
      html += '<div class="org-node"><div class="ava" style="margin:0 auto 6px">' + ini(mm.name) + '</div>'
        + '<div style="font-weight:600;font-size:var(--fs14)">' + esc(mm.name || '(no name)') + '</div>'
        + '<div style="font-size:var(--fs12);color:var(--gold);text-transform:uppercase;letter-spacing:.03em;margin-top:2px">' + esc(designationLabel(mm)) + '</div>'
        + (mm.phone ? ('<div style="font-size:var(--fs12);color:var(--tm);margin-top:4px">' + esc(mm.phone) + '</div>') : '')
        + (canManage ? ('<div style="display:flex;gap:4px;justify-content:center;margin-top:8px"><button class="btn sm" onclick="openEditOfficiatingMember(\'' + mm.id + '\')"><i class="ti ti-edit"></i></button><button class="btn sm danger" onclick="removeOfficiatingMember(\'' + mm.id + '\')"><i class="ti ti-trash"></i></button></div>') : '')
        + '</div>';
    }
    html += '</div>';
  }
  html += '</div>';
  el('main-content').innerHTML = html;
}
function officiatingFormFields(m) {
  var desigOpts = '';
  for (var i = 0; i < OFFICIATING_DESIGNATIONS.length; i++) { desigOpts += '<option value="' + esc(OFFICIATING_DESIGNATIONS[i]) + '"' + (m.designation === OFFICIATING_DESIGNATIONS[i] ? ' selected' : '') + '>' + esc(OFFICIATING_DESIGNATIONS[i]) + '</option>'; }
  return '<div class="field"><label>Full name</label><input id="m-com-name" value="' + esc(m.name) + '" placeholder="e.g. Danilo Cruz"></div>'
    + '<div class="g2"><div class="field"><label>Phone</label><input id="m-com-phone" value="' + esc(m.phone) + '"></div>'
    + '<div class="field"><label>Email</label><input id="m-com-email" value="' + esc(m.email) + '"></div></div>'
    + '<div class="field"><label>Designation</label><select id="m-com-desig" onchange="toggleComOther()">' + desigOpts + '</select></div>'
    + '<div class="field" id="m-com-other-wrap" style="display:' + (m.designation === 'Other' ? 'block' : 'none') + '"><label>Specify role</label><input id="m-com-other" value="' + esc(m.designationOther) + '" placeholder="e.g. Ground Marshal"></div>'
    + '<div class="field"><label>Org chart level <span style="color:var(--tm);font-weight:400">(1 = top, e.g. Commissioner)</span></label><input type="number" id="m-com-level" min="1" max="10" value="' + (m.orgLevel || defaultLevelForDesignation(m.designation)) + '"></div>'
    + '<div class="field" style="margin-bottom:0"><label>Notes <span style="color:var(--tm);font-weight:400">(optional)</span></label><input id="m-com-notes" value="' + esc(m.notes) + '"></div>';
}
function toggleComOther() {
  var wrap = el('m-com-other-wrap');
  var desig = el('m-com-desig').value;
  if (wrap) wrap.style.display = desig === 'Other' ? 'block' : 'none';
  var lvl = el('m-com-level');
  if (lvl) lvl.value = defaultLevelForDesignation(desig);
}
function openAddOfficiatingMember() {
  openModal('Add officiating team member', officiatingFormFields(defaultOfficiatingMember()), '<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveNewOfficiatingMember()"><i class="ti ti-plus"></i> Add</button>');
}
function readOfficiatingFormInto(m) {
  m.name = (el('m-com-name').value || '').trim();
  m.phone = (el('m-com-phone').value || '').trim();
  m.email = (el('m-com-email').value || '').trim();
  m.designation = el('m-com-desig').value;
  m.designationOther = (el('m-com-other') ? el('m-com-other').value : '').trim();
  m.orgLevel = parseInt((el('m-com-level') || {}).value) || defaultLevelForDesignation(m.designation);
  m.notes = (el('m-com-notes').value || '').trim();
}
/* Keep a Referee-designated committee member in sync with the dedicated
   S.referees roster, so they automatically show up in "Refereeing as" and
   the match-assignment dropdowns \u2014 without maintaining two separate
   referee identities by hand. */
function syncOfficiatingMemberReferee(m) {
  if (m.designation === 'Referee') {
    if (m.linkedRefereeId && getRefereeById(m.linkedRefereeId)) {
      var existing = getRefereeById(m.linkedRefereeId);
      existing.name = m.name;
      existing.phone = m.phone;
    } else {
      var r = defaultReferee();
      r.name = m.name;
      r.phone = m.phone;
      S.referees.push(r);
      m.linkedRefereeId = r.id;
    }
  } else if (m.linkedRefereeId) {
    removeRefereeSilently(m.linkedRefereeId);
    m.linkedRefereeId = null;
  }
}
function saveNewOfficiatingMember() {
  var m = defaultOfficiatingMember();
  readOfficiatingFormInto(m);
  if (!m.name) { showToast('Enter a name'); return; }
  S.officiatingTeam.push(m);
  syncOfficiatingMemberReferee(m);
  logAudit('Officiating team member added', m.name + ' \u2014 ' + designationLabel(m), null);
  closeModal();
  render();
  showToast('Added to officiating team' + (m.designation === 'Referee' ? ' \u2014 also added to the Referees roster' : ''));
}
function downloadOfficiatingTemplate() {
  var csv = 'Name,Phone,Email,Designation,Org Level,Notes\r\n'
    + 'Danilo Cruz,09171234567,danilo@example.com,Referee,3,\r\n'
    + 'Maria Reyes,09179876543,maria@example.com,Match Commissioner,1,Overall tournament lead\r\n';
  downloadTextFile(csv, 'officiating-team-template.csv', 'text/csv');
}
function handleOfficiatingCsvUpload(input) {
  readSpreadsheetFile(input, function (rows) {
    var added = 0, skipped = 0;
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      var name = csvField(r, ['Name', 'Full Name']);
      if (!name) { skipped++; continue; }
      var m = defaultOfficiatingMember();
      m.name = name;
      m.phone = csvField(r, ['Phone']);
      m.email = csvField(r, ['Email']);
      var desigRaw = csvField(r, ['Designation', 'Role']);
      var matched = null;
      for (var d = 0; d < OFFICIATING_DESIGNATIONS.length; d++) { if (OFFICIATING_DESIGNATIONS[d].toLowerCase() === desigRaw.toLowerCase()) { matched = OFFICIATING_DESIGNATIONS[d]; break; } }
      m.designation = matched || 'Other';
      if (!matched && desigRaw) m.designationOther = desigRaw;
      var levelRaw = csvField(r, ['Org Level', 'OrgLevel', 'Level']);
      m.orgLevel = parseInt(levelRaw) || defaultLevelForDesignation(m.designation);
      m.notes = csvField(r, ['Notes']);
      S.officiatingTeam.push(m);
      syncOfficiatingMemberReferee(m);
      added++;
    }
    if (added) logAudit('Officiating team bulk import', added + ' member(s) imported via CSV', null);
    render();
    showToast(added + ' member' + (added === 1 ? '' : 's') + ' imported' + (skipped ? (', ' + skipped + ' row(s) skipped (no name)') : ''));
  });
}
function openEditOfficiatingMember(id) {
  var m = getOfficiatingMemberById(id);
  if (!m) return;
  openModal('Edit officiating team member', officiatingFormFields(m), '<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveEditOfficiatingMember(\'' + id + '\')"><i class="ti ti-check"></i> Save</button>');
}
function saveEditOfficiatingMember(id) {
  var m = getOfficiatingMemberById(id);
  if (!m) return;
  readOfficiatingFormInto(m);
  syncOfficiatingMemberReferee(m);
  logAudit('Officiating team member updated', m.name + ' \u2014 ' + designationLabel(m), null);
  closeModal();
  render();
  showToast('Updated');
}
function removeOfficiatingMember(id) {
  var m = getOfficiatingMemberById(id);
  if (!m) return;
  if (!confirm('Remove "' + m.name + '" from the officiating team?')) return;
  if (m.linkedRefereeId) { removeRefereeSilently(m.linkedRefereeId); }
  var out = [];
  for (var i = 0; i < S.officiatingTeam.length; i++) { if (S.officiatingTeam[i].id !== id) out.push(S.officiatingTeam[i]); }
  S.officiatingTeam = out;
  logAudit('Officiating team member removed', m.name, null);
  render();
  showToast('Removed');
}

/* ---------------- TEAM REGISTRATION (public form + admin approval) ---------------- */
/* A prospective team manager fills this out before they have any account.
   Submitting creates a "pending" registration only — it does NOT create a
   Team or a User. An admin must review and Approve it; only then is a Team
   record added to the category and a User account (role: team) created for
   the manager. Until approved, that person has no way to "log in" (i.e. no
   User record exists for them to identify as on the Team dashboard). */
function defaultRegistration() {
  return {
    id: 'reg_' + uid(),
    status: 'pending', // pending | approved | rejected
    submittedAt: new Date().toISOString(),
    categoryId: '',
    teamName: '',
    coachName: '',
    coachPhone: '',
    managerName: '',
    managerEmail: '',
    managerPhone: '',
    players: [],
    docs: {
      birthCert: { fileName: '', submitted: false },
      medical: { fileName: '', submitted: false },
      registration: { fileName: '', submitted: false }
    },
    rejectReason: ''
  };
}
function ensureRegDraft() { if (!S.regDraft) S.regDraft = defaultRegistration(); return S.regDraft; }
function startNewRegistration() { S.regLastSubmitted = null; S.regDraft = null; render(); }

function renderRegisterPage() {
  if (S.regLastSubmitted) {
    var r = S.regLastSubmitted;
    setTopbar('Team Registration', 'Submitted');
    el('main-content').innerHTML = '<div class="card" style="text-align:center;padding:32px 20px"><i class="ti ti-check" style="font-size:var(--fs46);color:var(--green)"></i>'
      + '<div style="font-weight:700;font-size:var(--fs20);margin:12px 0 6px">Registration submitted</div>'
      + '<div style="font-size:var(--fs14);color:var(--tm);margin-bottom:18px;max-width:420px;margin-left:auto;margin-right:auto">' + esc(r.teamName) + ' has been submitted for review. A tournament manager will check your roster and documents, then approve your registration \u2014 you\'ll get a login (Team Manager account) once that happens.</div>'
      + '<button class="btn primary" onclick="startNewRegistration()"><i class="ti ti-plus"></i> Register another team</button></div>';
    return;
  }
  setTopbar('Team Registration', 'Join the tournament');
  var d = ensureRegDraft();
  var catOpts = '<option value="">Select category</option>';
  for (var c = 0; c < S.categories.length; c++) { catOpts += '<option value="' + S.categories[c].id + '"' + (d.categoryId === S.categories[c].id ? ' selected' : '') + '>' + esc(S.categories[c].name) + '</option>'; }
  var html = '<div class="alert alert-info"><i class="ti ti-info-circle"></i><span>Fill this out to register your team. You will not be able to log in as a Team Manager until a tournament manager reviews and approves this submission.</span></div>';
  html += '<div class="card"><div class="card-title"><i class="ti ti-layout-grid"></i> Category</div><div class="field" style="margin-bottom:0"><label>Which category are you entering?</label><select id="reg-cat" onchange="updateRegDraft()">' + catOpts + '</select></div></div>';
  html += '<div class="card"><div class="card-title"><i class="ti ti-users-group"></i> Team details</div>'
    + '<div class="g2"><div class="field"><label>Team name</label><input id="reg-teamname" value="' + esc(d.teamName) + '" oninput="updateRegDraft()" placeholder="e.g. Davao FC"></div>'
    + '<div class="field"><label>Coach name</label><input id="reg-coachname" value="' + esc(d.coachName) + '" oninput="updateRegDraft()"></div></div>'
    + '<div class="field" style="margin-bottom:0"><label>Coach phone</label><input id="reg-coachphone" value="' + esc(d.coachPhone) + '" oninput="updateRegDraft()"></div></div>';
  html += '<div class="card"><div class="card-title"><i class="ti ti-user"></i> Team Manager <span style="font-weight:400;color:var(--tm);font-size:var(--fs13)">(this becomes your login once approved)</span></div>'
    + '<div class="g2"><div class="field"><label>Full name</label><input id="reg-mgrname" value="' + esc(d.managerName) + '" oninput="updateRegDraft()"></div>'
    + '<div class="field"><label>Email</label><input id="reg-mgremail" value="' + esc(d.managerEmail) + '" oninput="updateRegDraft()" placeholder="name@example.com"></div></div>'
    + '<div class="field" style="margin-bottom:0"><label>Phone</label><input id="reg-mgrphone" value="' + esc(d.managerPhone) + '" oninput="updateRegDraft()"></div></div>';
  html += '<div class="card"><div class="card-title"><i class="ti ti-users"></i> Player roster (' + d.players.length + ')</div>';
  for (var p = 0; p < d.players.length; p++) {
    var pl = d.players[p];
    html += '<div class="g4" style="align-items:end;margin-bottom:10px">'
      + '<div class="field" style="margin-bottom:0"><label>Name</label><input value="' + esc(pl.name) + '" oninput="updateRegPlayer(' + p + ',\'name\',this.value)"></div>'
      + '<div class="field" style="margin-bottom:0"><label>Jersey</label><input value="' + esc(pl.jersey) + '" oninput="updateRegPlayer(' + p + ',\'jersey\',this.value)"></div>'
      + '<div class="field" style="margin-bottom:0"><label>Position</label><select onchange="updateRegPlayer(' + p + ',\'pos\',this.value)"><option value="">--</option><option' + (pl.pos === 'GK' ? ' selected' : '') + '>GK</option><option' + (pl.pos === 'DEF' ? ' selected' : '') + '>DEF</option><option' + (pl.pos === 'MID' ? ' selected' : '') + '>MID</option><option' + (pl.pos === 'FWD' ? ' selected' : '') + '>FWD</option></select></div>'
      + '<div style="display:flex;gap:6px;align-items:end"><div class="field" style="margin-bottom:0;flex:1"><label>Age</label><input value="' + esc(pl.age) + '" oninput="updateRegPlayer(' + p + ',\'age\',this.value)"></div><button class="btn sm danger" onclick="removeRegPlayer(' + p + ')"><i class="ti ti-trash"></i></button></div>'
      + '</div>';
  }
  html += '<button class="btn" onclick="addRegPlayer()"><i class="ti ti-user-plus"></i> Add player</button>'
    + '<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">'
    + '<button class="btn sm" onclick="downloadRosterTemplate()"><i class="ti ti-download"></i> Download CSV template</button>'
    + '<input type="file" id="reg-roster-csv" accept=".csv,.xlsx,.xls" style="display:none" onchange="handleRosterCsvUpload(this)">'
    + '<button class="btn sm" onclick="document.getElementById(\'reg-roster-csv\').click()"><i class="ti ti-upload"></i> Import roster from CSV</button>'
    + '</div></div>';
  html += '<div class="card"><div class="card-title"><i class="ti ti-file-text"></i> Documents</div>'
    + regDocRow('birthCert', 'Birth certificates', 'Required for all players')
    + regDocRow('medical', 'Medical clearance', 'Required')
    + regDocRow('registration', 'Team registration form', 'Signed by coach')
    + '</div>';
  html += '<button class="btn primary" style="width:100%;padding:14px" onclick="submitRegistration()"><i class="ti ti-check"></i> Submit registration</button>';
  el('main-content').innerHTML = html;
}
function regDocRow(key, label, sub) {
  var d = ensureRegDraft();
  var doc = d.docs[key];
  return '<div class="trow"><div><div class="tgl-label">' + label + '</div><div class="tgl-sub">' + sub + (doc.fileName ? (' \u2014 ' + esc(doc.fileName)) : '') + '</div></div>'
    + '<input type="file" id="reg-file-' + key + '" style="display:none" onchange="handleRegFile(\'' + key + '\',this)">'
    + '<button class="btn sm" onclick="document.getElementById(\'reg-file-' + key + '\').click()">' + (doc.submitted ? '<i class="ti ti-check"></i> Uploaded' : '<i class="ti ti-upload"></i> Upload') + '</button></div>';
}
function updateRegDraft() {
  var d = ensureRegDraft();
  if (el('reg-cat')) d.categoryId = el('reg-cat').value;
  if (el('reg-teamname')) d.teamName = el('reg-teamname').value;
  if (el('reg-coachname')) d.coachName = el('reg-coachname').value;
  if (el('reg-coachphone')) d.coachPhone = el('reg-coachphone').value;
  if (el('reg-mgrname')) d.managerName = el('reg-mgrname').value;
  if (el('reg-mgremail')) d.managerEmail = el('reg-mgremail').value;
  if (el('reg-mgrphone')) d.managerPhone = el('reg-mgrphone').value;
}
function addRegPlayer() { ensureRegDraft().players.push({ name: '', jersey: '', pos: '', age: '' }); render(); }
function downloadRosterTemplate() {
  var csv = 'Name,Jersey,Position,Age\r\nJuan Dela Cruz,7,MID,16\r\nMaria Santos,1,GK,15\r\n';
  downloadTextFile(csv, 'roster-template.csv', 'text/csv');
}
function handleRosterCsvUpload(input) {
  readSpreadsheetFile(input, function (rows) {
    var d = ensureRegDraft();
    var validPos = { GK: 1, DEF: 1, MID: 1, FWD: 1 };
    var added = 0, skipped = 0;
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      var name = csvField(r, ['Name', 'Player Name', 'Full Name']);
      if (!name) { skipped++; continue; }
      var posRaw = csvField(r, ['Position', 'Pos']).toUpperCase();
      d.players.push({
        name: name,
        jersey: csvField(r, ['Jersey', 'Jersey Number', 'No', 'Number']),
        pos: validPos[posRaw] ? posRaw : '',
        age: csvField(r, ['Age'])
      });
      added++;
    }
    render();
    showToast(added + ' player' + (added === 1 ? '' : 's') + ' imported' + (skipped ? (', ' + skipped + ' row(s) skipped (no name)') : ''));
  });
}
function removeRegPlayer(i) { ensureRegDraft().players.splice(i, 1); render(); }
function updateRegPlayer(i, key, val) { var d = ensureRegDraft(); if (d.players[i]) d.players[i][key] = val; }
function handleRegFile(key, inputEl) {
  var d = ensureRegDraft();
  var file = inputEl.files && inputEl.files[0];
  if (file) { d.docs[key].fileName = file.name; d.docs[key].submitted = true; }
  render();
}
function submitRegistration() {
  var d = ensureRegDraft();
  updateRegDraft();
  if (!d.categoryId) { showToast('Select a category'); return; }
  if (!d.teamName.trim()) { showToast('Enter a team name'); return; }
  if (!d.managerName.trim() || !d.managerEmail.trim()) { showToast('Enter the team manager\u2019s name and email'); return; }
  if (!d.players.length) { showToast('Add at least one player'); return; }
  d.submittedAt = new Date().toISOString();
  d.status = 'pending';
  S.registrations.push(d);
  logAudit('Team registration submitted', d.teamName + ' \u2014 ' + (getCategoryById(d.categoryId) ? getCategoryById(d.categoryId).name : ''), null);
  S.regLastSubmitted = d;
  S.regDraft = null;
  render();
  showToast('Registration submitted');
  pushToSheetsQuiet(); // Team Managers don't have manual Save access, so this action persists itself
}

/* ---- Admin review ---- */
function renderRegistrations() {
  var pending = 0;
  for (var i = 0; i < S.registrations.length; i++) { if (S.registrations[i].status === 'pending') pending++; }
  setTopbar('Registrations', pending + ' pending review');
  if (!S.registrations.length) { el('main-content').innerHTML = '<div class="empty"><i class="ti ti-user-plus"></i><p>No team registrations submitted yet.</p></div>'; return; }

      + statusBadge + '</div>'
      + '<div style="font-size:var(--fs13);color:var(--tm);margin-bottom:8px">Documents: ' + (docsSubmitted.length ? esc(docsSubmitted.join(', ')) : 'none uploaded') + '</div>'
      + '<button class="expand-btn" onclick="toggleExpand(this)"><i class="ti ti-chevron-down"></i> View roster</button><div class="mc-expand">' + regPlayersTable(r) + '</div>'
      + (r.status === 'pending' ? ('<div style="display:flex;gap:8px;margin-top:10px"><button class="btn primary sm" onclick="approveRegistration(\'' + r.id + '\')"><i class="ti ti-check"></i> Approve</button><button class="btn sm danger" onclick="rejectRegistration(\'' + r.id + '\')"><i class="ti ti-x"></i> Reject</button></div>')
        : (r.status === 'rejected' && r.rejectReason ? ('<div style="font-size:var(--fs13);color:var(--red);margin-top:6px">Reason: ' + esc(r.rejectReason) + '</div>') : ''))
      + '</div>';
  }
  el('main-content').innerHTML = html;
}
function regPlayersTable(r) {
  var html = '<table class="tbl"><thead><tr><th>Name</th><th>Jersey</th><th>Pos</th><th>Age</th></tr></thead><tbody>';
  for (var i = 0; i < r.players.length; i++) { var p = r.players[i]; html += '<tr><td>' + esc(p.name) + '</td><td>' + esc(p.jersey) + '</td><td>' + esc(p.pos) + '</td><td>' + esc(p.age) + '</td></tr>'; }

function approveRegistration(id) {
  var r = null;
  for (var i = 0; i < S.registrations.length; i++) { if (S.registrations[i].id === id) { r = S.registrations[i]; break; } }
  if (!r) return;
  var cat = getCategoryById(r.categoryId);
  if (!cat) { showToast('That category no longer exists'); return; }
  var staff = [];
  if (r.managerName) staff.push({ id: uid(), name: r.managerName, role: 'Team Manager', roleOther: '', phone: r.managerPhone || '' });
  if (r.coachName) staff.push({ id: uid(), name: r.coachName, role: 'Head Coach', roleOther: '', phone: r.coachPhone || '' });
  var newTeam = {
    id: uid(), name: r.teamName, coach: r.coachName, staff: staff,
    players: r.players.map(function (p) { return { id: uid(), name: p.name, jersey: p.jersey || '\u2014', pos: p.pos || '\u2014', age: p.age || '\u2014' }; }),
    docs: {
      birthCert: r.docs.birthCert.submitted ? 'submitted' : 'pending',
      medical: r.docs.medical.submitted ? 'submitted' : 'pending',
      registration: r.docs.registration.submitted ? 'submitted' : 'pending'
    }
  };
  cat.teams.push(newTeam);
  var newUser = defaultUser();
  newUser.name = r.managerName;
  newUser.email = r.managerEmail;
  newUser.role = 'team';
  newUser.assignedTeams = [newTeam.id];
  newUser.activeCategoryAccess = [cat.id];
  S.users.push(newUser);
  r.status = 'approved';
  logAudit('Registration approved', r.teamName + ' \u2014 team & manager account created for ' + r.managerName, null);
  render();

}
function rejectRegistration(id) {
  var r = null;
  for (var i = 0; i < S.registrations.length; i++) { if (S.registrations[i].id === id) { r = S.registrations[i]; break; } }
